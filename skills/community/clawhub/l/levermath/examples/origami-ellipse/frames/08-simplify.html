<div class="hd" data-k="hd" style="left:56px;top:32px;width:420px"><b>3.1.1</b>　椭圆及其标准方程</div>
<div class="hair" data-k="hair" style="left:56px;top:56px;width:1168px"></div>

<h1 class="h1" style="left:56px;top:88px;width:560px">两次平方，把根号去掉</h1>

<div class="row" data-enter="up" style="left:56px;top:168px">
  <span class="eq-n">(1)</span>
  <span class="eq"><span data-tex="\sqrt{(x+c)^2+y^2} + \sqrt{(x-c)^2+y^2} = 2a"></span></span>
  <span class="op">原式</span>
</div>

<div class="row" data-enter="up" data-enter-delay="70" style="left:56px;top:248px">
  <span class="eq-n">(2)</span>
  <span class="eq"><span data-tex="\sqrt{(x+c)^2+y^2} = 2a - \sqrt{(x-c)^2+y^2}"></span></span>
  <span class="op">移一个根式到右边</span>
</div>

<div class="row" data-enter="up" data-enter-delay="140" style="left:56px;top:328px">
  <span class="eq-n">(3)</span>
  <span class="eq"><span data-tex="a^2 - cx = a\sqrt{(x-c)^2+y^2}"></span></span>
  <span class="op">两边平方，整理</span>
</div>

<div class="row" data-enter="up" data-enter-delay="210" style="left:56px;top:408px">
  <span class="eq-n">(4)</span>
  <span class="eq"><span data-tex="(a^2-c^2)x^2 + a^2y^2 = a^2(a^2-c^2)"></span></span>
  <span class="op">两边再平方，整理</span>
</div>

<div class="row" data-enter="up" data-enter-delay="280" style="left:56px;top:488px">
  <span class="eq-n">(5)</span>
  <span class="eq"><span data-tex="\dfrac{x^2}{a^2} + \dfrac{y^2}{a^2-c^2} = 1"></span></span>
  <span class="op">两边同除以 <span data-tex="a^2(a^2-c^2)"></span></span>
</div>

<p class="small" data-enter="fade" data-enter-delay="340" style="left:56px;top:600px;width:900px">由 <span data-tex="2a > 2c > 0"></span> 得 <span data-tex="a > c > 0"></span>，所以 <span data-tex="a^2 - c^2 > 0"></span>，上面每一步都是同解变形。</p>
