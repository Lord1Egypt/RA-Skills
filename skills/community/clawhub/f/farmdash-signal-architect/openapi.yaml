openapi: 3.0.3
info:
  title: FarmDash Signal Architect API
  version: 1.2.0
  description: |
    Customer-controlled intelligence and workflow API for DeFi agents and serious airdrop farmers:
    structured opportunity intelligence, quote generation, user-authorized transaction preparation,
    x402 flows, and fee history. FarmDash does not request seed phrases or raw wallet private keys.
    Compatibility swap routes do not custody user funds; separately configured venue or MPC
    delegations remain subject to their provider controls and explicit policy bounds.

    ## Authentication
    - **Scout (Free)**: No auth. 30 requests/24h per IP.
    - **Pioneer**: `Authorization: Bearer <PIONEER_KEY>`. 1,500 requests/day.
    - **Syndicate**: `Authorization: Bearer <SYNDICATE_KEY>`. $199/mo USDC, 50,000 requests/day, webhooks, unrestricted CORS, and advanced control/session tooling for teams and serious agents.
    - **Swap execution**: Requires fresh quote review plus EIP-191 agent wallet signature.
    - **Delegation/autopilot**: Requires explicit user-configured budgets, allowlists, and revocation path.
    - **Privacy**: Public wallet addresses, token addresses, chain IDs, amounts, signatures, request IDs, and analytics headers may be sent to FarmDash; private keys and seed phrases are never sent.

    ## Dust Storm Protocol
    If an upstream API fails, FarmDash returns a typed error or a previously
    validated stale response with a `warnings` array containing
    `{ kind: "dust_storm", message: "..." }`. Missing data remains unknown
    rather than being converted into a synthetic zero.

    ## x402 Payment Wall
    When free-tier limits are exceeded, responses include `X-Payment-*` headers
    describing a one-off USDC payment on Base that unlocks the current request.
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT
servers:
  - url: https://www.farmdash.one/api
    description: Production
paths:
  /v1/agent/protocols:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getProtocolCatalog
      summary: Get catalog protocol directory (discovery heuristic scores)
      description: |
        Returns the curated FarmDash catalog with EDITORIAL discovery heuristic scores (catalog-editorial-v1). NOT live Trail Heat — canonical quantitative Trail Heat: /v1/trail-heat.
        Live quantitative Trail Heat uses calibrated TVL, seven-day TVL momentum, chain diversification,
        and category outperformance when upstream data is available. Editorial notes are separate
        metadata and excluded from the quantitative score. Static tracker pages use a distinct catalog
        discovery heuristic with TVL, status, category prior,
        hot momentum, and recency.
        Scout tier receives top 3 with encrypted numeric values.
        Pioneer/Syndicate tiers receive the full unencrypted dataset.
      tags:
        - Intelligence
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Protocol dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolsResponse'
              examples:
                success:
                  summary: getProtocolCatalog HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    tier: scout
                    count: 1
                    data:
                      - protocol_name: Hyperliquid
                        category: Perps
                        status: Confirmed Airdrop
                        chains:
                          - Arbitrum
                          - Ethereum
        '402':
          description: Free-tier limit exceeded — x402 payment required
          headers:
            X-Payment-Required:
              schema:
                type: string
              description: Compatibility signal for x402.
              example: 'true'
            X-Payment-Address:
              schema:
                type: string
              description: Treasury wallet (USDC on Base)
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              schema:
                type: string
              description: USDC contract on Base
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            X-Payment-Amount:
              schema:
                type: string
              description: Quoted amount in token decimals (e.g. 10000 = 0.01 USDC default overage)
              example: '10000'
            X-Payment-Chain-Id:
              schema:
                type: string
              description: 8453 (Base)
              example: '8453'
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
                      amount: 0.01 USDC
                      chain: Base
                      destination: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
                      token: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      chainId: '8453'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: getProtocolCatalog HTTP 429
                  description: Illustrative structured error; live code/retryability/request ID are authoritative.
                  value:
                    error: rate_limited
                    code: rate_limited
                    details: Illustrative FarmDash API example.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/protocols
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/chain-breakdown:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getChainBreakdown
      summary: Get protocol distribution by chain
      description: |
        Aggregates the protocol directory by blockchain network.
        Returns per-chain protocol counts, confirmed airdrops, points programs,
        and category coverage. Scout tier receives top 3 chains with encrypted numerics.
      tags:
        - Intelligence
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Chain breakdown data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainBreakdownResponse'
              examples:
                success:
                  summary: getChainBreakdown HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    tier: scout
                    data:
                      chains:
                        - chain: EVM
                      summary:
                        total_chains: 1
                        total_protocols: 1
                        dominant_chain: example
                        dominant_chain_pct: 1
        '402':
          description: Free-tier limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
                      amount: 0.01 USDC
                      chain: Base
                      destination: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
                      token: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      chainId: '8453'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
            X-Payment-Required:
              description: Compatibility signal for x402.
              schema:
                type: string
                enum:
                  - 'true'
              example: 'true'
            X-Payment-Amount:
              description: Illustrative Base USDC base units; live 402 is authoritative.
              schema:
                type: string
              example: '10000'
            X-Payment-Chain-Id:
              description: Illustrative payment chain.
              schema:
                type: string
              example: '8453'
            X-Payment-Address:
              description: Illustrative destination; verify live 402.
              schema:
                type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              description: Illustrative Base USDC address; verify live 402.
              schema:
                type: string
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        '429':
          description: Rate limit exceeded
          x-farmdash-response-example:
            status: 429
            description: Rate limit exceeded
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/chain-breakdown
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /agents/quote:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getSwapQuote
      summary: Get a token swap quote
      description: |
        Provider-neutral market estimate by default: returns an explicitly
        labelled `market_estimate` (reference price, approximate output,
        server fee tier, route compatibility, freshness) WITHOUT calling 0x,
        LI.FI, or Relay trading APIs. Browsing, polling, previews, and
        wallet-supplied GETs all receive estimation — a `walletAddress` alone
        is exploratory context, never execution intent, and never fans out
        into provider APIs. The estimate is intelligence, not a provider
        quote: no executable calldata, no provider attribution, no liquidity
        confirmation, never `executionReady: true`.
        For execution, POST `/v1/agent/quote-intent` with exact parameters, a
        real wallet, and an idempotency key to receive a firm single-provider
        quote bound to an `intentId`; then re-call this endpoint with the
        identical parameters plus `intentId` to serve the stored firm quote
        with zero new provider calls. Changed parameters never reuse a stale
        quote (`intent_params_changed`); unknown/expired intents return
        `intent_not_found`. One intent contacts exactly one primary provider;
        a sequential alternate follows only a genuine primary failure.
        `mock=true` is not supported and returns a typed 400 without contacting a provider.
      tags:
        - Swap
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - in: query
          name: fromChainId
          required: true
          schema:
            type: integer
          description: Source chain ID (e.g. 1 = Ethereum, 8453 = Base, 42161 = Arbitrum)
        - in: query
          name: toChainId
          required: true
          schema:
            type: integer
          description: Destination chain ID
        - in: query
          name: fromToken
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: Source token contract address (checksummed)
        - in: query
          name: toToken
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: Destination token contract address
        - in: query
          name: fromAmount
          required: true
          schema:
            type: string
            pattern: ^\d+$
          description: Amount in wei (no leading zeros)
        - in: query
          name: protocol
          required: false
          schema:
            type: string
            enum:
              - lifi
              - relay
          description: Force a specific routing protocol (auto-selected if omitted)
        - in: query
          name: walletAddress
          required: false
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: Optional real wallet. Exploratory context only — a wallet alone never triggers provider quoting. For execution, POST /api/v1/agent/quote-intent.
        - in: query
          name: toAddress
          required: false
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: Optional destination wallet override for previewing the signed route
        - in: query
          name: slippage
          required: false
          schema:
            type: number
            minimum: 0.01
            maximum: 5
          description: Optional slippage tolerance in percent
        - in: query
          name: expectedUpsideUsd
          required: false
          schema:
            type: number
          description: Optional upside estimate used to enforce positive net edge
        - in: query
          name: riskBufferUsd
          required: false
          schema:
            type: number
          description: Optional execution-risk haircut added to total route cost
        - in: query
          name: healthFactor
          required: false
          schema:
            type: number
          description: Optional health factor used for halt checks
        - in: query
          name: liquidationBufferPct
          required: false
          schema:
            type: number
          description: Optional liquidation buffer percentage used for halt checks
        - in: query
          name: safetyMode
          required: false
          schema:
            $ref: '#/components/schemas/SwapSafetyMode'
          description: '`strict` halts on severe quote decay, `balanced` downgrades that condition to a warning'
        - in: query
          name: intentId
          required: false
          schema:
            type: string
          description: Execution-intent ID from POST /api/v1/agent/quote-intent. Serves the stored firm quote with zero new provider calls when all other parameters exactly match the intent; mismatches return intent_params_changed, unknown IDs return intent_not_found.
      responses:
        '200':
          description: Market estimate (default) or stored firm quote when intentId is supplied and parameters match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuoteResponse'
              examples:
                success:
                  summary: getSwapQuote HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    protocol: lifi
                    estimatedOutput: '1'
                    feeBps: 1
                    feeAmountUSD: '1'
                    gasEstimate: '1'
                    txData:
                      to: example
                      data: example
                      value: '1'
                      chainId: 1
                    expiresAt: 1
                    note: This is an unsigned preview quote. Run POST /api/v1/simulate before execution.
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: getSwapQuote HTTP 400
                  description: Illustrative structured error; live code/retryability/request ID are authoritative.
                  value:
                    error: invalid_request
                    code: invalid_request
                    details: Illustrative FarmDash API example.
        '402':
          description: Free-tier limit exceeded
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
            X-Payment-Required:
              description: Compatibility signal for x402.
              schema:
                type: string
                enum:
                  - 'true'
              example: 'true'
            X-Payment-Amount:
              description: Illustrative Base USDC base units; live 402 is authoritative.
              schema:
                type: string
              example: '10000'
            X-Payment-Chain-Id:
              description: Illustrative payment chain.
              schema:
                type: string
              example: '8453'
            X-Payment-Address:
              description: Illustrative destination; verify live 402.
              schema:
                type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              description: Illustrative Base USDC address; verify live 402.
              schema:
                type: string
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
                      amount: 0.01 USDC
                      chain: Base
                      destination: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
                      token: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      chainId: '8453'
        '404':
          description: Unknown/expired intentId (intent_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: getSwapQuote HTTP 404
                  description: Illustrative structured error; live code/retryability/request ID are authoritative.
                  value:
                    error: not_found
                    code: not_found
                    details: Illustrative FarmDash API example.
        '422':
          description: Typed quote failure. Categories carry machine-readable retryable flags (e.g. no_liquidity/unsupported_pair retryable false; provider_rate_limited/provider_unavailable retryable true). Read attempts[] evidence per provider.
          x-farmdash-response-example:
            status: 422
            description: Typed quote failure. Categories carry machine-readable retryable flags (e.g. no_liquidity/unsupported_pair retryable false; provider_rate_limited/provider_unavailable retryable true). Read attempts[] evidence per provider.
            body: null
            note: Documents status semantics without inventing a response payload.
        '429':
          description: Rate limit exceeded
          x-farmdash-response-example:
            status: 429
            description: Rate limit exceeded
            body: null
            note: Documents status semantics without inventing a response payload.
        '502':
          description: Typed live quote provider degradation (retryable). Includes provider rate-limit code quote_provider_rate_limited.
          x-farmdash-response-example:
            status: 502
            description: Typed live quote provider degradation (retryable). Includes provider rate-limit code quote_provider_rate_limited.
            body: null
            note: Documents status semantics without inventing a response payload.
        '504':
          description: Live quote provider timed out. Code quote_provider_timeout, retryable true.
          x-farmdash-response-example:
            status: 504
            description: Live quote provider timed out. Code quote_provider_timeout, retryable true.
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/agents/quote?fromChainId=1&toChainId=1&fromToken=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&toToken=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&fromAmount=1
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/market-estimate:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getMarketEstimate
      summary: Get a provider-neutral market estimate
      description: |
        Explicit estimation endpoint for browsing, previews, and walletless
        exploration. Returns an explicitly labelled market_estimate (reference
        price, approximate output, server fee tier, freshness) and makes zero
        0x/LI.FI/Relay trading calls. Never executable, never attributed.
        For execution, POST /v1/agent/quote-intent.
      tags:
        - Swap
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
        - in: query
          name: fromChainId
          required: true
          schema:
            type: integer
        - in: query
          name: toChainId
          required: true
          schema:
            type: integer
        - in: query
          name: fromToken
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
        - in: query
          name: toToken
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
        - in: query
          name: fromAmount
          required: true
          schema:
            type: string
            pattern: ^\d+$
      responses:
        '200':
          description: Market estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuoteResponse'
              examples:
                success:
                  summary: getMarketEstimate HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    protocol: lifi
                    estimatedOutput: '1'
                    feeBps: 1
                    feeAmountUSD: '1'
                    gasEstimate: '1'
                    txData:
                      to: example
                      data: example
                      value: '1'
                      chainId: 1
                    expiresAt: 1
                    note: This is an unsigned preview quote. Run POST /api/v1/simulate before execution.
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: getMarketEstimate HTTP 400
                  description: Illustrative structured error; live code/retryability/request ID are authoritative.
                  value:
                    error: invalid_request
                    code: invalid_request
                    details: Illustrative FarmDash API example.
        '429':
          description: Rate limit exceeded
          x-farmdash-response-example:
            status: 429
            description: Rate limit exceeded
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/market-estimate?fromChainId=1&toChainId=1&fromToken=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&toToken=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&fromAmount=1
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/quote-intent:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: createQuoteIntent
      summary: Create an execution intent with a firm single-provider quote
      description: |
        Explicit execution intent. Requires exact chain pair, token pair,
        amount, real wallet/taker, destination, slippage, and a client
        idempotency key; the fee tier is resolved server-side before any
        provider call. One intent contacts exactly one primary provider; a
        sequential alternate follows only a genuine primary failure.
        Identical intents reuse the stored firm quote (HTTP 200 reused:true);
        changed parameters never reuse a stale quote. The firm quote flows
        through simulate, approval, and prepare without further provider
        quote requests. Quote is not execution; FarmDash never signs or
        broadcasts.
      tags:
        - Swap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromChainId
                - toChainId
                - fromToken
                - toToken
                - fromAmount
                - walletAddress
                - toAddress
                - slippage
                - idempotencyKey
              properties:
                fromChainId:
                  type: integer
                toChainId:
                  type: integer
                fromToken:
                  type: string
                toToken:
                  type: string
                fromAmount:
                  type: string
                walletAddress:
                  type: string
                toAddress:
                  type: string
                slippage:
                  type: number
                  minimum: 0.01
                  maximum: 5
                protocol:
                  type: string
                  enum:
                    - lifi
                    - relay
                idempotencyKey:
                  type: string
            examples:
              default:
                summary: createQuoteIntent request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  fromChainId: 1
                  toChainId: 1
                  fromToken: USDC
                  toToken: USDC
                  fromAmount: '1'
                  walletAddress: '0x1111111111111111111111111111111111111111'
                  toAddress: '0x1111111111111111111111111111111111111111'
                  slippage: 0.01
                  idempotencyKey: fd-example-idempotency-001
                  protocol: lifi
      responses:
        '200':
          description: Stored firm quote reused for an identical intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuoteResponse'
              examples:
                success:
                  summary: createQuoteIntent HTTP 200
