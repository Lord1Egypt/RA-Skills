version: "1.0.0"
updated: "2026-11-19"
# 监控套件采样配置权威模板（扁平键值，PowerShell 5.1 原生可解析，无需第三方库）
# 安装监控（模块35.1）时复制到 ~/.workbuddy/output/winskill/monitor-config.yaml
# 用户编辑 output 副本，下一采样周期自动生效；本文件为仓库内权威来源。

# 五类采样开关（true=开启，false=关闭）
sample_cpu: true
sample_mem: true
sample_disk: true
sample_svc: true
sample_evt: true
sample_smart: true

# 采样间隔（分钟），按 CPU 核数自动选取
interval_min_low: 15
interval_min_high: 10

# 阈值
cpu_warn: 80
cpu_alert: 90
mem_warn: 85
mem_alert: 95
disk_warn: 85
disk_alert: 95
svc_check: Spooler,Winmgmt,Dnscache,W32Time
evt_window_min: 15
evt_max: 50

# 告警策略（连续3周期 + 去抖 + 日上限，防扰民）
streak_required: 3
dedup_min: 30
daily_push_cap: 5

# ===== 模糊重复检测阈值（模块34，保留）=====
fuzzy_filename_similarity_threshold: 0.75
fuzzy_size_approximation_threshold: 0.10
fuzzy_min_file_size: 10485760
fuzzy_large_file_threshold: 104857600
fuzzy_max_compare_per_bucket: 1000
