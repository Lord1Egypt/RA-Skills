<div class="hd" data-k="hd" style="left:56px;top:32px;width:420px"><b>3.1.1</b>　椭圆及其标准方程</div>
<div class="hair" data-k="hair" style="left:56px;top:56px;width:1168px"></div>

<h1 class="h1" style="left:56px;top:92px;width:700px">两个方程，一个名字</h1>

<div class="card" data-enter="left" style="left:56px;top:190px;width:560px;height:258px">
  <p class="card-h">焦点在 <span data-tex="x"></span> 轴</p>
  <div class="eq" style="font-size:32px;text-align:center"><span data-tex="\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1"></span></div>
  <div class="eq" style="font-size:22px;text-align:center;margin-top:14px"><span data-tex="F_1(-c,0),\ F_2(c,0)"></span></div>
</div>

<div class="card" data-enter="left" data-enter-delay="90" style="left:664px;top:190px;width:560px;height:258px">
  <p class="card-h">焦点在 <span data-tex="y"></span> 轴</p>
  <div class="eq" style="font-size:32px;text-align:center"><span data-tex="\dfrac{y^2}{a^2} + \dfrac{x^2}{b^2} = 1"></span></div>
  <div class="eq" style="font-size:22px;text-align:center;margin-top:14px"><span data-tex="F_1(0,-c),\ F_2(0,c)"></span></div>
</div>

<p class="lead" data-enter="up" data-enter-delay="180" style="left:56px;top:540px;width:1168px;text-align:center">
  两个方程都叫椭圆的标准方程；<span class="kw">分母大的那一项是谁，焦点就在谁的轴上</span>。
</p>
