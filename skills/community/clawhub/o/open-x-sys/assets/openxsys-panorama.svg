<rect x="1064" y="750" width="276" height="43" rx="9" fill="#fff" stroke="#b9c2dc"/><text x="1202" y="777" text-anchor="middle" class="body">portable across AI tools and time</text>
<path class="wire" d="M700 663V697"/><text x="712" y="685" class="tiny">what changes future behavior</text><path class="wire dash" d="M1250 397V680H1010V697"/><text x="1238" y="678" text-anchor="end" class="tiny">cross-system relations</text>
<text x="1365" y="835" text-anchor="end" class="tiny">OpenXSys · use systems to understand systems · use systems to build systems</text>
