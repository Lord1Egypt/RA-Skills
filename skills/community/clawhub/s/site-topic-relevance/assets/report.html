<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Site Topic Relevance</title>
<style>
:root{color-scheme:light;--ink:#171e2c;--muted:#526075;--line:#d9dfe8;--paper:#ffffff;--accent:#584875;--sans:"Avenir Next","Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#111827;color:var(--ink);font:15px/1.65 var(--sans)}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94778b;outline-offset:4px}a{color:inherit;text-underline-offset:4px}.masthead{max-width:1320px;margin:auto;padding:28px 40px;display:flex;justify-content:space-between;color:#e9eef8;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.masthead span{opacity:.6}main{max-width:1240px;margin:8px auto 70px;background:var(--paper);border-radius:22px;overflow:clip}.hero{padding:44px 44px 30px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}.hero h1{font-size:clamp(27px,4.8vw,64px);line-height:1.04;letter-spacing:-.06em;overflow-wrap:anywhere;margin:14px 0 18px}.hero .summary{max-width:820px;color:var(--muted);font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:12px;color:var(--muted);margin-top:24px}.tabs{display:flex;gap:28px;padding:0 44px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:20px 0 16px;font-size:13px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}.overview{display:grid;grid-template-columns:1.35fr 1fr}.map-panel{padding:30px 30px 28px 40px;min-width:0}.aside{padding:30px;background:#eef2f7;border-left:1px solid var(--line)}h2{font-size:25px;line-height:1.2;letter-spacing:-.04em;margin:8px 0 14px}h3{font-size:16px;line-height:1.4;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 6px}.segmented{display:flex;background:#ecf0f6;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}.segmented button,.ghost{border:0;background:transparent;border-radius:5px;padding:8px 13px;font-size:12px}.segmented button[aria-pressed=true]{background:#ffffff;box-shadow:0 1px 3px #1827411a}.ghost{color:var(--accent)}.map-stage{aspect-ratio:1;position:relative;isolation:isolate}.chart{position:absolute;inset:0}.map-backdrop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.map-backdrop circle{fill:none;stroke:#dde4ef;stroke-width:1}.map-backdrop .mean{stroke:#61718b;stroke-dasharray:4 7;stroke-width:1.2}.map-backdrop .core{fill:#3a4960;stroke:none}.map-backdrop text{fill:var(--muted);font:9px var(--sans);letter-spacing:1px}.map-backdrop .edge{stroke:#a2afc2;stroke-width:1.3}.mean-label{position:absolute;right:5%;top:5%;pointer-events:none;text-align:right;color:var(--muted);font-size:10px}.mean-label b{display:block;font-size:20px;color:#33445f}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend button{background:none;border:1px solid var(--line);padding:7px 10px;border-radius:5px;font-size:11px}.legend button[aria-pressed=true]{border-color:var(--accent);background:#eee9f6}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.hint{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;font-size:11px;color:var(--muted)}.topic-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:12px}.topic-row small{white-space:nowrap;color:var(--muted)}.topic-row b{font-size:18px}.purpose{padding:22px 0;border-bottom:1px solid var(--line);font-size:13px}.finding{padding-top:24px}.finding p{color:var(--muted);font-size:13px}.evidence-panel{padding:32px 44px}.filters{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0 20px}.filters input{flex:1;min-width:160px}.filters input,.filters select{border:1px solid var(--line);border-radius:6px;background:#f6f8fc;color:var(--ink);padding:10px 12px;min-width:0}.page-card{border-top:1px solid var(--line);padding:18px 0}.page-card summary{cursor:pointer;display:flex;align-items:start;gap:20px;justify-content:space-between;list-style:none}.page-card summary::marker{content:''}.page-card strong{display:block;font-size:14px}.page-card .url{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.page-card .fit{font-size:13px;white-space:nowrap}.page-body{padding:18px 0 8px;max-width:850px}.page-body p{font-size:13px;color:var(--muted)}blockquote{border-left:2px solid #8a9ab2;margin:18px 0;padding:0 20px;color:#3f5069;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.preview{position:fixed;z-index:10;max-width:380px;width:min(380px,calc(100vw - 24px));background:#ffffff;border:1px solid #ccd6e5;box-shadow:0 18px 70px #1f305424;border-radius:13px;padding:23px;visibility:hidden}.preview[data-open=true]{visibility:visible}.preview h3{font-size:17px;letter-spacing:-.025em;overflow-wrap:anywhere;padding-right:18px}.preview .url{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.preview .description{font-size:13px;margin:16px 0}.preview .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:11px}.preview .close{position:absolute;right:10px;top:8px;background:none;border:0;font-size:20px;color:var(--muted)}.preview .view-evidence{border:0;background:var(--accent);color:#ffffff;border-radius:5px;padding:8px 12px}.coverage{border-top:1px solid var(--line);padding:20px 44px;font-size:12px}.coverage summary{cursor:pointer}.coverage ul{padding-left:20px}.coverage li{overflow-wrap:anywhere}.keyboard-list{margin-top:12px}.keyboard-list summary{cursor:pointer;font-size:12px;color:var(--muted)}.keyboard-list button{display:block;width:100%;text-align:left;padding:9px;background:none;border:0;border-bottom:1px solid var(--line);font-size:12px}.method{padding:24px 44px 34px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.method p{max-width:1000px}[hidden]{display:none!important}.count{font-size:12px;color:var(--muted)}@media(max-width:760px){.masthead{padding:22px 20px;gap:20px;font-size:10px}.masthead span{display:none}main{margin:0 12px 30px;border-radius:14px}.hero{padding:28px 22px 24px}.hero .summary{font-size:14px}.tabs{padding:0 22px;gap:24px}.tabs button{font-size:12px}.overview{grid-template-columns:1fr}.map-panel{padding:25px 20px}.aside{border-left:0;border-top:1px solid var(--line);padding:26px 22px}.evidence-panel{padding:25px 22px}.coverage,.method{padding:22px}.preview{max-height:calc(100dvh - 24px);overflow:auto}.page-card summary{gap:12px}.filters select{width:100%}.meta{gap:8px 18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}

/* Keep the current source in view alongside the desktop map. */
.overview {
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  grid-template-areas: "map source" "map findings";
}
.map-panel { grid-area: map; }
.selected-page {
  grid-area: source;
  min-width: 0;
  padding: 30px;
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #f6f8fc;
  overflow-wrap: anywhere;
}
.aside {
  grid-area: findings;
  min-width: 0;
  overflow-wrap: anywhere;
}
.selected-page h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0; }
.selected-page h3 { margin: 0 0 6px; font-size: clamp(18px, 2vw, 24px); letter-spacing: -.025em; }
.selected-page p { margin: 12px 0; }
#selected-link { margin: 0; font-size: 12px; }
.selected-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  color: var(--muted);
  font-size: 12px;
}
.selected-meta strong { color: var(--ink); font-size: 18px; }
#selected-source-label { display: block; margin-top: 16px; font-size: 11px; font-weight: 700; color: var(--muted); }
.selected-page blockquote { margin: 6px 0 16px; padding-left: 12px; }
#selected-more { padding: 0; min-height: 32px; font-weight: 700; text-align: start; }
.selected-point {
  position: absolute;
  width: 21px;
  height: 21px;
  border: 1px solid;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.findings-details { margin-top: 14px; }
.findings-details summary {
  padding: 9px 0;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.map-labels { position: absolute; inset: 0; pointer-events: none; }
.map-label {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 5px;
  width: 112px;
  min-height: 24px;
  max-height: 48px;
  padding: 3px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  font-size: 11px;
  line-height: 1.18;
}
.map-label[data-compact='true'] {
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border-radius: 50%;
}
.map-label-name {
  min-width: 0;
  overflow-wrap: anywhere;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}
.topic-number {
  display: inline-grid;
  place-items: center;
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  border: 1px solid var(--topic-color);
  border-radius: 50%;
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.legend button { display: flex; align-items: center; gap: 6px; text-align: start; }
.mean-label {
  position: static;
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 12px;
  text-align: start;
}
.mean-label::before { content: ''; width: 18px; border-top: 1px dashed #61718b; }
.mean-label b { font-size: inherit; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .overview { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "source" "findings"; }
  .selected-page { padding: 24px 22px; border-left: 0; border-top: 1px solid var(--line); }
  .aside { border-top: 0; }
  .legend button { min-height: 36px; }
}
.sitemap-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-top: 14px;
  overflow-wrap: anywhere;
}
</style></head><body>
<header class="masthead"><strong>DomainRank / Content Intelligence</strong><span>Independent field report</span></header>
<main><section class="hero"><p class="eyebrow" data-label="eyebrow">Site Topic Relevance</p><h1 id="domain"></h1><p id="summary" class="summary"></p><div id="meta" class="meta"></div></section>
<nav class="tabs" role="tablist" aria-label="Report views"><button id="tab-overview" role="tab" aria-selected="true" aria-controls="overview" data-view="overview">Topic overview</button><button id="tab-evidence" role="tab" aria-selected="false" aria-controls="evidence" data-view="evidence" tabindex="-1">Page evidence</button></nav>
<div id="overview" class="overview" role="tabpanel" aria-labelledby="tab-overview"><section class="map-panel"><p class="eyebrow">01 / CONTENT MAP</p><h2 id="map-heading">Your site’s topic radius</h2><p class="muted" id="map-intro"></p><div class="controls"><div class="segmented" aria-label="Map display"><button id="radius-view" aria-pressed="true">Radius map</button><button id="topic-view" aria-pressed="false">By topic</button></div><button id="replay" class="ghost">↻ Replay</button></div><div class="map-stage"><svg class="map-backdrop" id="backdrop" viewBox="0 0 480 480" aria-hidden="true"><circle class="edge" cx="240" cy="240" r="190"/><circle cx="240" cy="240" r="126" opacity=".45"/><circle cx="240" cy="240" r="64" opacity=".3"/><circle class="mean" id="mean-circle" cx="240" cy="240" r="80"/><circle class="core" cx="240" cy="240" r="4"/><text x="255" y="226">SITE CORE</text></svg><div id="chart" class="chart" role="img" aria-labelledby="map-heading" tabindex="0"></div><div id="selected-point" class="selected-point" aria-hidden="true" hidden></div><div class="map-labels" id="map-labels" aria-hidden="true"></div></div><div class="mean-label" id="mean-label"></div><div id="legend" class="legend" aria-label="Focus a topic"></div><p id="hint" class="hint"></p><details class="keyboard-list"><summary id="keyboard-label">Explore pages with keyboard</summary><div id="keyboard-pages"></div></details></section>
<section id="selected-page" class="selected-page" aria-labelledby="selected-heading">
  <h2 id="selected-heading">Selected page</h2>
  <h3 id="selected-title" dir="auto"></h3>
  <p id="selected-link"></p>
  <p class="selected-meta">
    <strong id="selected-score"></strong>
    <span id="selected-topic" dir="auto"></span>
    <span id="selected-position"></span>
  </p>
  <p id="selected-reason" dir="auto"></p>
  <span id="selected-source-label">Source excerpt</span>
  <blockquote id="selected-quote" dir="auto"></blockquote>
  <button id="selected-more" class="ghost" type="button">View full page evidence ↗</button>
</section>
<aside class="aside"><p class="eyebrow">02 / OUTSIDE THE RADIUS</p><h2 id="outside-heading"></h2><p class="muted" id="outside-summary"></p><div id="topic-rows"></div><div class="purpose"><h3 id="purpose-label"></h3><span id="purpose"></span></div><details class="findings-details"><summary id="findings-summary">View site findings</summary><div id="findings"></div></details></aside></div>
<section id="evidence" class="evidence-panel" role="tabpanel" aria-labelledby="tab-evidence" hidden><p class="eyebrow">03 / PAGE EVIDENCE</p><h2 id="evidence-heading"></h2><div class="filters"><input id="search" type="search" aria-label="Search page titles or URLs"><select id="topic-filter" aria-label="Filter topic"></select><select id="fit-filter" aria-label="Filter relevance"></select></div><p id="result-count" class="count" role="status"></p><div id="pages"></div></section>
<details class="coverage"><summary id="coverage-summary"></summary><div id="sitemap-sources" class="sitemap-sources" hidden></div><ul id="skipped"></ul></details><section class="method"><p class="eyebrow">METHOD / CONTENT BEFORE ASSUMPTION</p><p id="method"></p><p id="privacy"></p></section></main>
<section id="preview" class="preview" role="dialog" aria-labelledby="preview-title" aria-hidden="true"><button class="close" aria-label="Close page overview">×</button><p class="eyebrow" id="preview-label"></p><h3 id="preview-title"></h3><a id="preview-url" class="url" target="_blank" rel="noopener noreferrer"></a><p id="preview-description" class="description"></p><div class="footer"><span id="preview-topic"></span><button class="view-evidence" id="preview-evidence"></button></div></section>
<noscript>This report needs JavaScript for the interactive map. The adjacent report.md contains the complete readable report.</noscript>
<script id="report-data" type="application/json">/*REPORT_DATA*/null</script><script>/*REPORT_APP*/</script>
</body></html>
