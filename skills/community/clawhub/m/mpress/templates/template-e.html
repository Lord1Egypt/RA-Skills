<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1800px; height: 766px;
    overflow: hidden;
    background: #F4F7F6;
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .cover {
    width: 1800px; height: 766px;
    position: relative;
    background: #F4F7F6;
    color: #111819;
    overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(0, 114, 117, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0, 114, 117, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .left-bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 22px;
    background: var(--theme-accent, #007275);
    z-index: 3;
  }

  /* 左侧主视觉：大字极简，只留域名 + 书名 + 标题 + 章号 */
  .left-pane {
    position: absolute; left: 22px; top: 0; width: 1188px; height: 766px;
    padding: 64px 60px 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    z-index: 2;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 3px solid #111819;
    padding-bottom: 20px;
  }
  .domain-badge {
    display: flex; align-items: center; gap: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 38px; font-weight: 800; color: #111819; letter-spacing: -0.02em;
  }
  .domain-sq { width: 18px; height: 18px; background: var(--theme-accent, #007275); }
  .issue-pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 30px; font-weight: 800; color: #FFFFFF;
    background: var(--theme-accent, #007275);
    padding: 8px 22px; border-radius: 6px;
    letter-spacing: 0.08em;
  }

  .middle {
    margin: auto 0;
    border-left: 10px solid var(--theme-accent, #007275);
    padding-left: 40px;
  }
  .book-kicker {
    font-size: 36px; font-weight: 700;
    color: var(--theme-accent, #007275);
    margin: 0 0 22px;
    line-height: 1.3;
  }
  .heading {
    font-size: 92px; font-weight: 900; line-height: 1.18; margin: 0;
    color: #111819; letter-spacing: -0.025em; word-break: break-word;
  }

  /* =====================================================================
     右侧 1:1 正方形主视觉（x=1250..1750, y=133..633, 500x500）
     放大 3D 对象，只保留大字：书名 + 文章标题 + 章号 + shxuk.cn
     ===================================================================== */
  .right-stage {
    position: absolute;
    left: 1250px; top: 133px;
    width: 500px; height: 500px;
    border-radius: 16px;
    background: var(--stage-bg, #E8EFEF);
    border: 1.5px solid #CED9D9;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    z-index: 2;
  }
  .stage-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0, 114, 117, 0.14) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  /* 1) 3D 精装书封 (mode = book) */
  .book-scene {
    perspective: 1200px;
    position: relative; z-index: 2;
    transform: translateX(12px);
  }
  .book-3d {
    position: relative;
    width: 320px; height: 428px;
    transform-style: preserve-3d;
    transform: rotateY(-18deg) rotateX(5deg) rotateZ(-1deg);
    filter: drop-shadow(-20px 24px 24px rgba(10, 22, 34, 0.45));
  }
  .book-front {
    position: absolute; inset: 0;
    border-radius: 5px 12px 12px 5px;
    background: linear-gradient(145deg, var(--book-from, #153152) 0%, var(--book-via, #0E223A) 55%, var(--book-to, #081526) 100%);
    transform: translateZ(16px);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    padding: 28px 26px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
    color: var(--book-ink, #FFFFFF);
  }
  .book-spine {
    position: absolute; top: 0; left: 0; width: 32px; height: 100%;
    background: linear-gradient(90deg, var(--book-to, #081526) 0%, var(--book-from, #153152) 100%);
    transform: rotateY(-90deg); transform-origin: left center;
    border-radius: 5px 0 0 5px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .book-pages {
    position: absolute; top: 5px; right: 0; width: 32px; height: calc(100% - 10px);
    background: repeating-linear-gradient(90deg, #E8EEEE 0px, #C7D1D1 1px, #E8EEEE 2px, #9AA5A6 3px);
    transform: rotateY(90deg) translateZ(320px); transform-origin: right center;
  }
  .book-radar {
    position: absolute; right: -45px; top: 65px; width: 250px; height: 250px;
    opacity: 0.22; pointer-events: none;
  }
  .book-top {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1.5px solid rgba(255,255,255,0.28);
    padding-bottom: 12px;
    font-family: ui-monospace, monospace; font-size: 18px; font-weight: 800;
    letter-spacing: 0.06em; color: var(--book-accent, #93BEF0);
  }
  .book-center {
    margin: auto 0;
  }
  .book-series {
    font-size: 20px; font-weight: 700; line-height: 1.35;
    color: var(--book-accent, #93BEF0);
    margin: 0 0 12px;
  }
  .book-title {
    margin: 0;
    font-size: 40px; font-weight: 900; line-height: 1.22;
    letter-spacing: -0.01em; color: var(--book-ink, #FFFFFF);
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    word-break: break-word;
  }
  .book-foot {
    border-top: 1.5px solid rgba(255,255,255,0.28);
    padding-top: 12px;
    font-family: ui-monospace, monospace; font-size: 17px; font-weight: 700;
    color: var(--book-accent, #93BEF0); letter-spacing: 0.06em;
  }

  /* 2) 短篇杂志卷宗视觉 (mode = essay) */
  .essay-scene {
    position: relative; z-index: 2;
    width: 370px; height: 410px;
  }
  .essay-back {
    position: absolute; inset: 0;
    transform: rotate(5deg) translate(12px, 10px);
    background: #FFFFFF; border: 2px solid #B6CCCC; border-radius: 12px;
  }
  .essay-front {
    position: absolute; inset: 0;
    transform: rotate(-2deg);
    background: #007275; color: #FFFFFF;
    border-radius: 12px; padding: 30px 28px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: -14px 20px 30px rgba(0, 75, 78, 0.3);
  }
  .essay-top {
    display: flex; justify-content: space-between; align-items: center;
    font-family: ui-monospace, monospace; font-size: 18px; font-weight: 800;
    letter-spacing: 0.08em; color: #D6F0F0;
    border-bottom: 1.5px solid rgba(255,255,255,0.28); padding-bottom: 12px;
  }
  .essay-mid {
    font-size: 40px; font-weight: 900; line-height: 1.24; color: #FFFFFF;
    word-break: break-word;
  }
  .essay-foot {
    border-top: 1.5px solid rgba(255,255,255,0.28); padding-top: 12px;
    font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700; color: #D6F0F0;
  }

  /* 3) 工具深色终端视觉 (mode = tool) */
  .tool-scene {
    position: relative; z-index: 2;
    width: 390px; height: 390px;
    background: #111819; color: #E9EFEF;
    border-radius: 14px; border: 2px solid #2A3A3C;
    box-shadow: -14px 22px 32px rgba(10, 18, 20, 0.45);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tool-bar {
    padding: 16px 20px; background: #1A2426; border-bottom: 1.5px solid #2A3A3C;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tool-dots { display: flex; gap: 8px; }
  .tool-dots span { width: 12px; height: 12px; border-radius: 50%; background: #3D4E50; }
  .tool-dots span:first-child { background: #00A3A6; }
  .tool-badge {
    font-family: ui-monospace, monospace; font-size: 16px; font-weight: 800;
    color: #6AD2D5; letter-spacing: 0.1em;
  }
  .tool-body {
    flex: 1; padding: 28px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .tool-cmd { font-size: 36px; font-weight: 900; line-height: 1.28; color: #FFFFFF; word-break: break-word; }
  .tool-cmd span { color: #4FA8AB; font-family: ui-monospace, monospace; }
  .tool-foot {
    border-top: 1.5px solid #253335; padding-top: 14px;
    font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700;
    color: #8EA6A8; display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="cover" id="coverRoot">
    <div class="left-bar"></div>
    <div class="grid-bg"></div>

    <div class="left-pane">
      <div class="header">
        <div class="domain-badge"><span class="domain-sq"></span>{{SITE_DOMAIN}}</div>
        <span class="issue-pill">{{ISSUE_NO}}</span>
      </div>

      <div class="middle">
        <p class="book-kicker" id="bookKicker">{{BOOK_OR_TAG}}</p>
        <h1 class="heading" id="title">{{TITLE}}</h1>
      </div>

      <div></div>
    </div>

    <div class="right-stage" id="rightStage">
      <div class="stage-grid"></div>

      <!-- 模式 A：3D 书封 -->
      <div class="book-scene" id="modeBook" style="display:none;">
        <div class="book-3d">
          <div class="book-spine"></div>
          <div class="book-pages"></div>
          <div class="book-front" id="bookFront">
            <svg class="book-radar" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1">
              <circle cx="60" cy="60" r="52" stroke-dasharray="4 4"/>
              <circle cx="60" cy="60" r="34"/>
              <circle cx="60" cy="60" r="16"/>
              <path d="M60 4v112M4 60h112"/>
            </svg>
            <div class="book-top">
              <span>{{SITE_DOMAIN}}</span>
              <span>{{ISSUE_NO}}</span>
            </div>
            <div class="book-center">
              <p class="book-series">{{BOOK_TITLE}}</p>
              <div class="book-title" id="sqTitleBook">{{TITLE}}</div>
            </div>
            <div class="book-foot">{{BOOK_TAG}}</div>
          </div>
        </div>
      </div>

      <!-- 模式 B：短篇杂志卷宗 -->
      <div class="essay-scene" id="modeEssay" style="display:none;">
        <div class="essay-back"></div>
        <div class="essay-front">
          <div class="essay-top">
            <span>ESSAY</span>
            <span>{{ISSUE_NO}}</span>
          </div>
          <div class="essay-mid" id="sqTitleEssay">{{TITLE}}</div>
          <div class="essay-foot">{{SITE_DOMAIN}}</div>
        </div>
      </div>

      <!-- 模式 C：工具终端 -->
      <div class="tool-scene" id="modeTool" style="display:none;">
        <div class="tool-bar">
          <div class="tool-dots"><span></span><span></span><span></span></div>
          <span class="tool-badge">TOOL</span>
        </div>
        <div class="tool-body">
          <div class="tool-cmd" id="sqTitleTool"><span>$</span> {{TITLE}}</div>
          <div class="tool-foot">
            <span>{{SITE_DOMAIN}}</span>
            <span>{{ISSUE_NO}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const mode = "{{COVER_MODE}}";
    const palette = "{{BOOK_PALETTE}}";
    const root = document.getElementById("coverRoot");
    if (mode === "book") {
      document.getElementById("modeBook").style.display = "block";
      if (palette === "墨蓝") {
        root.style.setProperty("--theme-accent", "#1C4D7E");
        root.style.setProperty("--book-from", "#17375E");
        root.style.setProperty("--book-via", "#0E223A");
        root.style.setProperty("--book-to", "#071322");
        root.style.setProperty("--book-accent", "#93BEF0");
        root.style.setProperty("--stage-bg", "#E7EEF5");
      } else if (palette === "墨色") {
        root.style.setProperty("--theme-accent", "#2A3038");
        root.style.setProperty("--book-from", "#262B33");
        root.style.setProperty("--book-via", "#191D23");
        root.style.setProperty("--book-to", "#0F1216");
        root.style.setProperty("--book-accent", "#B2BAC7");
        root.style.setProperty("--stage-bg", "#EAECEF");
      } else if (palette === "暖米") {
        root.style.setProperty("--theme-accent", "#B23A1D");
        root.style.setProperty("--book-from", "#F3ECDD");
        root.style.setProperty("--book-via", "#EAE0CC");
        root.style.setProperty("--book-to", "#D9CCB3");
        root.style.setProperty("--book-ink", "#191512");
        root.style.setProperty("--book-accent", "#B23A1D");
        root.style.setProperty("--stage-bg", "#EFEAE0");
      } else {
        root.style.setProperty("--theme-accent", "#007275");
        root.style.setProperty("--book-from", "#005E61");
        root.style.setProperty("--book-via", "#004648");
        root.style.setProperty("--book-to", "#002B2D");
        root.style.setProperty("--book-accent", "#8ED2D4");
        root.style.setProperty("--stage-bg", "#E6EFEF");
      }
    } else if (mode === "tool") {
      document.getElementById("modeTool").style.display = "flex";
      root.style.setProperty("--theme-accent", "#111819");
      root.style.setProperty("--stage-bg", "#E8ECEC");
    } else {
      document.getElementById("modeEssay").style.display = "block";
    }

    const t = document.getElementById("title");
    if (t.innerText.length > 14) t.style.fontSize = "76px";
    if (t.innerText.length > 22) t.style.fontSize = "62px";
    for (const id of ["sqTitleBook", "sqTitleEssay", "sqTitleTool"]) {
      const el = document.getElementById(id);
      if (!el) continue;
      if (el.innerText.length > 14) el.style.fontSize = "32px";
      if (el.innerText.length > 22) el.style.fontSize = "26px";
    }
  </script>
</body>
</html>
