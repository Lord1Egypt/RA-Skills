name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/moon-jewelry-dish/build_dish.py
      - run: python scripts/u1_mesh_check.py examples/moon-jewelry-dish/moon-jewelry-dish.stl
