<div class="hd" data-k="hd" style="left:56px;top:32px;width:420px"><b>3.1.1</b>　椭圆及其标准方程</div>
<div class="hair" data-k="hair" style="left:56px;top:56px;width:1168px"></div>

<h1 class="h1" style="left:56px;top:88px;width:600px">给 <span data-tex="a^2-c^2"></span> 一个名字</h1>

<div class="panel" data-enter="up" style="left:56px;top:180px;width:600px">
  <p class="small" style="margin:0 0 10px">取短轴端点 <span data-tex="P(0,b)"></span>，则</p>
  <div class="eq"><span data-tex="|PF_1| = |PF_2| = a"></span></div>
  <div class="eq" style="margin-top:6px"><span data-tex="|OF_1| = |OF_2| = c"></span></div>
  <div class="eq" style="margin-top:6px"><span data-tex="|PO| = \sqrt{a^2-c^2}"></span></div>
</div>

<div data-enter="up" data-enter-delay="150" style="left:56px;top:430px;width:600px">
  <p class="small" style="margin:0 0 6px">令 <span data-tex="b = \sqrt{a^2-c^2}"></span>，即 <span data-tex="c^2 = a^2 - b^2"></span>，方程 (5) 写成</p>
  <div class="eq standard" style="font-size:34px;margin-top:12px">
    <span data-tex="\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1"></span>
    <span class="cond"><span data-tex="(a > b > 0)"></span></span>
  </div>
</div>
