    <p data-page-node-id="DHi4drJOSM5r2H0zvnAtli"><!--pnid:O6e9gM3gN1n17hyicmqOdi-->这本书不再把「忙」当作勋章，而是把时间拆成可以经营的小单元。碎片十五分钟，不是喘息的边角料，而是主线的滋养期——我开始每天固定留十五分钟给学习的劲头，不刷课，只保持在场。</p>
    <p data-page-node-id="nDlgJSWLzIxEFKvlr79vUl"><!--pnid:kEnvWs9lpfn9JBYj1vdkzz-->读到「用系统替代意志力」那章，我在旁边贴了便签：我做成的每一个 skill，都不是计划出来的，是顺手做出来之后，再补的计划。种一棵树最好的时间是十年前，其次是现在——书里没写这句话，但它整本都在讲。</p>
