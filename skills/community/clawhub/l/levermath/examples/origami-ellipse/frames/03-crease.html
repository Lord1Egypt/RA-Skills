<h1 class="h1" style="left:56px;top:96px;width:540px">折痕自己排成一条曲线</h1>

<p class="point" style="left:56px;top:200px;width:530px"><span data-tex="P"></span> 是圆上的动点，<span data-tex="F_1"></span> 是圆内的定点</p>
<p class="point" style="left:56px;top:258px;width:530px">把 <span data-tex="P"></span> 折到 <span data-tex="F_1"></span>，折痕是 <span data-tex="PF_1"></span> 的垂直平分线</p>
<p class="point" style="left:56px;top:316px;width:530px">折痕落在圆内，是一条弦</p>
<p class="point" style="left:56px;top:374px;width:530px">弦一条条排下去，围出的边界是一条曲线</p>
