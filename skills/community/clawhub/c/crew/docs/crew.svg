  <!-- main -->
  <text x="40" y="78" fill="#bb9af7" font-weight="bold">main</text>
  <text x="84" y="78" fill="#565f89">claude · fable</text>
  <text x="40" y="112" fill="#c0caf5">❯ /crew astra high</text>
  <text x="40" y="136" fill="#9ece6a">⏺ astra 已就绪：codex，</text>
  <text x="40" y="156" fill="#9ece6a">  GPT-6.2-Astra，effort high</text>
