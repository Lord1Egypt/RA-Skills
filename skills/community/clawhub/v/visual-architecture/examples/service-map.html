<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #f8fafc;
      --ink: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #f8fafc;
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 28px;
    }
    header, footer {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 40px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      max-width: 760px;
      margin: 0;
      color: #cbd5e1;
      line-height: 1.55;
    }
    .artifact {
      width: min(1180px, 100%);
      margin: 0 auto;
      align-self: center;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 24px 64px rgba(2, 6, 23, 0.28);
    }
    .artifact svg {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: #cbd5e1;
      font-size: 13px;
    }
    code {
      color: #dbeafe;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(203, 213, 225, 0.24);
      border-radius: 6px;
      padding: 3px 6px;
    }
  </style>
</head>
