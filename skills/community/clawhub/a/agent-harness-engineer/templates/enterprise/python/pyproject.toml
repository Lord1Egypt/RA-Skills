[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{PROJECT_NAME}"
version = "0.1.0"
description = "{PROJECT_DESCRIPTION}"
requires-python = ">=3.10"

# ⚠ AI构建提示: 根据用户选择的LLM供应商和基础设施填充实际依赖
dependencies = [
    # Core
    # "openai>=1.0",
    # "anthropic>=0.39",
    # "httpx>=0.27",
    # "pyyaml>=6.0",
    # "python-dotenv>=1.0",
    # "pydantic>=2.0",
    # "pydantic-settings>=2.0",
    # Observability
    # "opentelemetry-api>=1.20",
    # "opentelemetry-sdk>=1.20",
    # "prometheus-client>=0.20",
    # Distributed
    # "redis>=5.0",
    # "celery>=5.3",
    # Storage
    # "sqlalchemy>=2.0",
    # "asyncpg>=0.29",
    # Security
    # "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    # "pytest>=8.0",
    # "pytest-asyncio>=0.24",
    # "pytest-cov>=4.1",
    # "black>=24.0",
    # "ruff>=0.3",
    # "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"