[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-long-term-memory"
version = "1.0.0"
description = "Three-tier long-term memory for AI agents — short-term + entity + episodic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "exp007" }
]
keywords = [
    "ai", "agent", "memory", "llm", "rag",
    "long-term-memory", "entity-memory", "episodic-memory",
    "codex-skill", "chromadb", "sqlite",
    "ai-agent", "conversation", "context"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=0.4.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/exp007/agent-long-term-memory"
Repository = "https://github.com/exp007/agent-long-term-memory.git"
Issues = "https://github.com/exp007/agent-long-term-memory/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["agent_memory", "agent_memory.core"]
