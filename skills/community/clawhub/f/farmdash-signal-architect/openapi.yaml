x-farmdash-capability-truth: {"spot.USER_SIGNED":{"status":"operational","prerequisite":"Healthy execution governor, quote provider, RPC and durable receipt store; customer signs and submits."},"spot.BOUNDED_AUTONOMOUS":{"status":"operational","prerequisite":"Owner-signed EVM grant, exact simulation/calldata binding, durable budget and customer-local signer authority."},"futures.USER_SIGNED":{"status":"operational","prerequisite":"Venue account ownership, local action signature, builder approval, risk/research gates and durable order control."},"futures.BOUNDED_AUTONOMOUS":{"status":"operational","prerequisite":"Authenticated owner-bound futures policy, authorized local API-wallet signature, durable nonce/budget/order controls."},"solana.USER_SIGNED":{"status":"operational","prerequisite":"Native Jupiter/RPC route, durable preparation and finality store; customer signs and broadcasts."},"solana.BOUNDED_AUTONOMOUS":{"status":"operational","prerequisite":"Native owner-signed Solana policy; local key must be an actual required transaction signer. Policy creates no on-chain authority."},"ERC4337_SERVER_SUBMISSION":{"status":"preparation_only","prerequisite":"Qualified tenant/account authorization and session-key policy enforcement on public forwarding, configured bundler, durable claims and verified receipt integration."},"GENERIC_SERVER_INTENT_EXECUTION":{"status":"preparation_only","prerequisite":"Trusted executable adapter, exact signed-transaction binding and canonical receipt verifier."},"MEE":{"status":"preparation_only","prerequisite":"Production coordinator and authoritative source/destination receipt verifier."},"ACP":{"status":"deployment_prerequisite","prerequisite":"AcpReadinessService paidWorkflowReady, evaluator/client identities, migrations, funding/finality workers and Base RPC."}}
x-farmdash-example-contract:
  version: 1
  examples_are_illustrative: true
  live_response_is_authoritative: true
  security_note: Never copy example signatures, nonces, hashes, payment destinations, or timestamps into a real transaction.
  x402_note: Live HTTP 402 and PAYMENT-REQUIRED are authoritative. Payment grants eligible API capacity only; never wallet signing or execution authority.
x-farmdash-simulation-contract:
  invariant: simulation != execution; simulation never grants wallet authority, broadcasts a transaction, or proves settlement
  execution_preflight:
    endpoint: /v1/simulate
    operationId: simulateSwapExecution
    side_effects: none
    grants_execution_authority: false
    broadcasts_transaction: false
    proves_settlement: false
    binding: wallet + fd_intent_* quote intent + transaction fingerprint + freshness window
  research_projection:
    operationId: simulatePoints
    side_effects: none
    grants_execution_authority: false
    authoritative_for_execution: false
  futures_research:
    operationId: analyzeStrategy
    simulation_methodology: heuristic_preflight
    grants_execution_authority: false
    authoritative_for_execution: false
  solana_preparation:
    operationId: prepareSolanaSwap
    simulation: authoritative RPC preflight is embedded before prepared transaction return
    grants_execution_authority: false
    broadcasts_transaction: false
    proves_settlement: false
