<h1 class="h1" style="left:56px;top:92px;width:560px">把距离换成坐标</h1>

<div class="eq" data-enter="up" style="left:56px;top:200px;width:640px;font-size:30px">
  <span data-tex="|MF_1| = \sqrt{(x+c)^2 + y^2}"></span>
</div>
<div class="eq" data-enter="up" data-enter-delay="90" style="left:56px;top:276px;width:640px;font-size:30px">
  <span data-tex="|MF_2| = \sqrt{(x-c)^2 + y^2}"></span>
</div>

<div class="hair" data-enter="fade" data-enter-delay="160" style="left:56px;top:380px;width:560px"></div>

<p class="small" data-enter="fade" data-enter-delay="200" style="left:56px;top:404px;width:560px">代入 <span data-tex="|MF_1| + |MF_2| = 2a"></span>，得</p>

<div class="eq" data-enter="up" data-enter-delay="200" style="left:56px;top:470px;width:940px;font-size:34px">
  <span data-tex="\sqrt{(x+c)^2+y^2} + \sqrt{(x-c)^2+y^2} = 2a"></span>
  <span class="eq-n" style="margin-left:20px">(1)</span>
</div>
