/* ============================================================
   html-base.css — style-card HTML 引擎强制底座（全文，勿删改）
   ============================================================ */
:root {
    --card-width: 1170px;
    --card-height: 1560px;
    --bg-page: #1A0B2E;
    --ink: #1a1a1a;
    --accent: #e8b04b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: var(--card-width);
    height: var(--card-height);
    overflow: hidden;
    background: var(--bg-page);
    color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}
.card {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
h1, h2, h3 { font-weight: 900; line-height: 1.25; }
p, li { line-height: 1.6; }
p, li, span { overflow-wrap: break-word; }
.pixelated { image-rendering: pixelated; }
.pixel-font { font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; letter-spacing: 0.02em; }
.hand-font  { font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif; }
::selection { background: transparent; }

/* === 卡片覆盖变量 === */
:root { --bg-page: #1A0B2E; --card-width: 1170px; --card-height: 1560px; }

/* === 网格背景 === */
.grid-bg {
    position: absolute; inset: 0;
    background:
        repeating-linear-gradient(0deg, rgba(42,42,74,0.55) 0 2px, transparent 2px 60px),
        repeating-linear-gradient(90deg, rgba(42,42,74,0.55) 0 2px, transparent 2px 60px),
        radial-gradient(circle at 50% 30%, #2A1550 0%, #1A0B2E 70%);
}

/* === 区块1：顶部 meta 行 === */
.meta-top {
    position: relative;
    padding: 46px 56px 0;
    display: flex; justify-content: space-between; align-items: center;
}
.meta-top .tag {
    font-family: 'Space Grotesk', monospace;
    font-size: 26px; letter-spacing: 0.18em; color: #00E5FF;
    text-shadow: 0 0 12px #00E5FF, 0 0 28px #00E5FF88;
}
.meta-top .star { color: #FF2E9A; font-size: 30px; text-shadow: 0 0 14px #FF2E9A; }

/* === 区块2：主视觉（铬金属圆环 + 蝴蝶像素块） === */
.visual {
    position: relative;
    height: 380px; margin-top: 20px;
    display: flex; align-items: center; justify-content: center;
}
.chrome-ring {
    width: 320px; height: 320px; border-radius: 50%;
    background:
        radial-gradient(circle at 32% 28%, #F0F0FA 0%, #D9D9E8 18%, #B8B8D8 38%, #7A7A9E 62%, #3A3A5E 88%, #1A1A30 100%);
    box-shadow: 0 0 60px rgba(0,229,255,0.25), inset 0 0 40px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.chrome-ring::after {
    content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle at 40% 32%, #2A1550 0%, #1A0B2E 70%);
}
.chrome-ring .butterfly {
    position: relative; z-index: 2; font-size: 88px; color: #F5FF3D;
    text-shadow: 0 0 18px #FF2E9A, 0 0 30px #FF2E9A;
}
.sat { position: absolute; font-size: 60px; color: #FF2E9A; text-shadow: 0 0 16px #FF2E9A; }
.sat.s1 { top: 60px; left: 150px; }
.sat.s2 { bottom: 60px; right: 150px; color: #00E5FF; text-shadow: 0 0 16px #00E5FF; }
.sat.s3 { top: 90px; right: 210px; color: #F5FF3D; text-shadow: 0 0 16px #F5FF3D; font-size: 44px; }

/* === 区块3：主标题（铬金属渐变） === */
.title {
    position: relative; text-align: center; margin-top: 30px;
    font-family: 'Noto Sans SC', sans-serif; font-weight: 900;
    font-size: 130px; line-height: 1.15; letter-spacing: 0.04em;
    background: linear-gradient(180deg, #F4F4FF 0%, #D9D9E8 30%, #9A9AC0 55%, #6A6A92 80%, #C8C8E0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5));
}
.subtitle {
    position: relative; text-align: center; margin-top: 22px;
    font-family: 'Noto Sans SC', sans-serif; font-weight: 600;
    font-size: 44px; color: #F0F0F0; letter-spacing: 0.08em;
    text-shadow: 0 0 8px #FF2E9A, 0 0 22px #FF2E9A, 0 0 40px #8A2BE2;
}

/* === 区块4：全息彩虹分隔线 === */
.rainbow {
    position: relative; width: 560px; height: 10px; margin: 40px auto 0;
    border-radius: 6px;
    background: linear-gradient(90deg, #FF2E9A, #FFD23D, #00E5FF, #8A2BE2, #FF2E9A);
    box-shadow: 0 0 24px rgba(255,46,154,0.5);
}

/* === 区块5：要点（荧光标签） === */
.points {
    position: relative; margin-top: 48px;
    padding: 0 56px;
    display: flex; justify-content: center; gap: 28px; flex-wrap: wrap;
}
.chip {
    padding: 18px 30px; border-radius: 40px;
    border: 2px solid rgba(255,255,255,0.25);
    font-family: 'Noto Sans SC', sans-serif; font-weight: 700;
    font-size: 34px; color: #0A0A0A;
    background: linear-gradient(135deg, #F5FF3D, #FFD23D);
    box-shadow: 0 0 20px rgba(245,255,61,0.5);
}
.chip.c2 { background: linear-gradient(135deg, #00E5FF, #00AACC); color: #001B1B; box-shadow: 0 0 20px rgba(0,229,255,0.5); }
.chip.c3 { background: linear-gradient(135deg, #FF2E9A, #C4006E); color: #fff; box-shadow: 0 0 20px rgba(255,46,154,0.5); }

/* === 区块6：底部 meta === */
.meta-bottom {
    position: relative; margin-top: auto;
    padding: 0 56px 48px;
    display: flex; justify-content: space-between; align-items: center;
}
.meta-bottom .l {
    font-family: 'ZCOOL QingKe HuangYou', monospace;
    font-size: 28px; color: #00E5FF; letter-spacing: 0.1em;
    text-shadow: 0 0 10px #00E5FF66;
}
.meta-bottom .r {
    font-family: 'Space Grotesk', monospace;
    font-size: 26px; color: #B8B8D8; letter-spacing: 0.15em;
}
</style>
