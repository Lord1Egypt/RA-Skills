architecture:
  standard: multi_agent_role_pipeline
  worker_roles: [T1, T2, T3, T4, T5, T6, T7, T9, G14]
  owner_roles: [T0, T8]
  owner_nodes: [phase0_definition, phase2_5_outline, phase3_5_insight, pre_spawn_enforcement, t2_5_integrity, current_draft_sync, t7_5_integrity, phase4_4_figures, final_assembly, t9b_stress_test, t8_technical_final, methodology_snapshot, phase5_acceptance]
  worker_failure_policy: owner_takeover_with_disclosure
  fallback_is_not_equivalent: true
  worker_terminal_states: [worker_not_started, worker_running, worker_failed, worker_empty_output, worker_timeout, main_controller_takeover, owner_decision_required, not_executed]
  worker_state_rules: {empty_output_is_success: false, takeover_preserves_original_role_done: false, takeover_requires_disclosure: true, t9_takeover: forbidden}
# ⚠️ P0-3：版本号 vN 只随闸门里程碑推进；minor 自修走 vN.m；风格修订走 vN-style。
version_numbering:
  milestone_rule: vN 整数位只由闸门节点推进（phase3_5_insight / t5_feedback_revision / audit_revision）
  minor_patch: vN.m           # 字数/图位/AI味/M门/术语 → 只推进小数位，不推进整数位
  style_revision: vN-style    # G14 风格修订 → 独立标识，不进 vN 序列
  milestones: [v1|t5_draft_v1, v2|phase3_5_insight, v3|t5_feedback_revision, v4|audit_revision, v5|audit_revision]
  detail: pipeline-overview.md『修订回环仲裁规则』   # 判定口径真源
condition_definitions:
# ⚠️ v2.12.54 R-4：每条条件定义必须登记生产方（producer + producer_marker），否则构建期校验不通过（规则 25）。
#   实测：t9_review 依赖 owner_peer_review_consent 而全仓无生产方 ⇒ 节点静默不触发。
#   规则：字段名无生产方 ≠ 保守失败，而是断链——条件永远取假，节点在认知层与执行层同时消失。
  owner_peer_review_opt_out:         # 默认启用 + 主人 opt-out；本键语义 = 主人已显式 opt-out 同行评审
    requires: [owner_peer_review_opt_out]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "同行评审"
  methodology_snapshot_opt_out:      # 默认触发 + 主人 opt-out；本键语义 = 主人已显式 opt-out
    requires: [owner_methodology_snapshot_opt_out]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "方法论留档"
  phase1_5_brief_flag_trigger:    # 2026-10-08 审计 R-1（B1）：原 `phase1_5_targeted_review_any_trigger_hit` 含两项触发（简报标记 + T2.5 红数据），但承载它的节点 seq=4 **早于** t2_5_integrity(5) ⇒ 红数据项首次到达恒为假、且被 on_not_triggered 静默吞掉。拆分后本键**只认简报标记**
    requires: [phase0_review_flags]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "待复核关键 Dxx"
  phase1_5b_red_data_trigger:     # 2026-10-08 审计 R-1（B1）：T2.5 判定报 🔴 二手转引未回溯时触发定向回查；由 phase1_5b_post_t2_5_review(6) 承担，**排在 t2_5_integrity(5) 之后**（时序可达）
    requires: [t2_5_red_data_flag]
    producer: references/_shared/真源/M-Gate-核心.md
    producer_marker: "M-Form-6"
  t5_t7_report_unverified_references:   # v2.13.0 P0-1（ECS 实战反馈）：T5 修订说明/初稿或 T7 审计报告出现「待人工核验」标记 ⇒ t1b_targeted_review 定向回查；T9 发现的引用问题走 Phase 5 主人拍板（时序在后，不回流）
    requires: [t5_report_marker, t7_report_marker]
    producer: references/agents/05-写作-writer.md
    producer_marker: "待人工核验"
  T6_requires_revision:
    requires: [t6_report_p0_or_p1]
    producer: references/agents/06-批判-critical-companion.md
    producer_marker: "否决项清单"   # P1-1：高可攻击性/砍论点 ⇒ 视为 P0/P1 否决项
  T7_P0_or_P1:
    requires: [t7_report_p0_or_p1]
    producer: references/dispatch/T7-审计.md
    producer_marker: "P0"
  target_language_includes_zh:
    requires: [owner_target_language]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "目标语言"
  G14_requires_style_revision:
    requires: [g14_report_style_fail]
    producer: references/gates/14-中文AI痕迹-gate.md
    producer_marker: "Fail"
  figures_approved_by_owner:
    requires: [owner_figure_decision]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "figure_decision"
  owner_stress_test_opt_in:     # 2026-10-05：T9b 由「默认触发 + 主人 opt-out」改为「默认不跑 + 主人 opt-in」（架构评审 v3 R2 附带裁决：实跑 40+ 项目零产出、产出无下游消费方、主控重读定稿全文成本高；三剧本本身保留，冲刺投稿时开）
    requires: [owner_stress_test_opt_in]
    producer: references/templates/任务简报-template-lite.md
    producer_marker: "压力测试轮"

m_gate_criterion_fields:
# v2.12.65 P0-1：M 门判据字段须登记生产方（同 R-4 断链治理）
  data_requirements_in_brief:
    producer: references/templates/任务简报-template.md
    producer_marker: "需找数据点"

owner_checkpoints:
  - phase0_definition
  - phase2_5_outline
  - phase3_5_insight
  - phase5_acceptance

pipeline:
  - id: phase0_definition
    phase: "Phase 0"
    phase_seq: 0
    kind: owner_checkpoint
    blocking: true        # v2.12.49：人环闸门 —— 无明确决策不得推进（真源 = owner_timeout_policy）
    owner_visible: true   # v2.12.49：必须按 checkpoint-card-template 向主人呈现
    decisions: [approved, revision_requested]   # v2.12.61：Phase 0 **进线**二态（approved=开始 / revision_requested=补充信息后重出简报）。
    #   「暂停 / 拒绝」= **未进线出口**（流水线外前置门），不进本词表 → 记 status.md `pre_pipeline_exit`。
    #   原 restart_phase 系 v2.12.28「与其余人工节点结构对齐」复制而来：Phase 0 即定题，无更早节点可回退，
    #   该值在本节点自指不可达 ⇒ 移除（避免「真源声明了、卡与 status 却无从落到」）。
    timeout_fallback: pending_owner_halt
    blocks: [retrieval]   # v2.15.13 FB-12：局部阻塞 —— 本检查点只阻塞检索层；允许「呈现但不等」的并行准备（如顶配/三档路由探活、模板加载）可在等待期进行，全局停摆非本节点语义
    output: 01-任务简报.md
    next: pre_spawn_enforcement
  - id: pre_spawn_enforcement
    phase: "Phase 0 后置（spawn 前核验）"
    phase_seq: 1
    kind: mode_declaration
    owner: 主控
    blocking: true
    input: 01-任务简报.md
    output: status.md（Phase 0 同意记录与标准架构声明）
    precondition: Phase 0 外发同意记录 + 目标语言 + 项目名 + 模型路由记录（01-任务简报.md §模型映射 的 phase0_route 段，且 selected_by=owner；真源 = route_tier.md §三）均已写入 01-任务简报.md；phase0_route 缺记录或 selected_by 为空 = 本节点未过，判 path_or_param_error（2026-10-08 审计 R-5：取消 route_tier「无记录走默认」fail-open 尾巴）
    write_authority: owner
    top_tier_liveness_gate:                 # v2.12.49 T-3：Phase 0 后置顶配档探活门（在任何 worker spawn 之前）
      target: 顶配档（批判审计：T6 / T7 / T9 / G14）
      attempts: 3
      min_interval_seconds: 10
      on_failure: pause_owner_three_choice   # 换 provider 族 / 换能力档 / 接受同源（+ 披露独立性不成立）
      record: 01-任务简报.md §模型映射（含探活时间戳）
      staleness_minutes: 60                  # 超 1 小时需重探
    context_budget_gate:                  # v2.12.72 E：主控上下文预算门，防窗口压缩导致的话术复制造成漂移
      position: Phase 0 后置（本节点内，任何 worker spawn 之前）
      estimate_by_tier: true               # Phase 0 按字数档位预估总 token
      estimate_model: references/_shared/真源/performance-benchmarks.md §五
      margin_threshold_pct: 30             # 余量低于 30% ⇒ 必须给出落盘减负建议
      overspend_alert_pct: 150             # 实测超过预算 150% ⇒ 超支预警
      on_low_margin: emit_offload_suggestions_and_continue
      offload_actions:
        - 中间产物全文指针化（只留路径与结论）
        - dispatch 只读当前要 spawn 的角色话术（不得凭记忆复制）
        - 已完成产物按需局部 read，不全文重读
      recheck: every_phase_boundary
      record: status.md §4.8（预算估算、实测消耗、余量、落盘减负动作）
      doctrine: >
        主控窗口余量属运行期自观测，构建期无法机械校验；本门只锁协议与留痕不得从载体静默消失。
        余量低于阈值必须写落盘减负建议；实测超过预算阈值必须写超支预警，不得静默继续或臆测精确值。
    note: "标准架构 = 多 Agent 九角色流水线（无需勾选、不设总开关）。本节点只做 spawn 前前置核验（同意记录 / 目标语言 / 项目名 / 派发角色清单）**+ v2.12.49 T-3 顶配档探活门**（≤3 次、间隔 ≥10s；失败 ⇒ 当场与主人确认降档含换族；结果含时间戳写入简报 §模型映射，超 1 小时重探）**+ v2.12.72 E 主控上下文预算门**（按档位预估、余量低时落盘减负、运行中每个阶段边界复核）；**不再决定「是否启用多 Agent」**；worker 不可用属单节点故障，走 on_worker_failure 主控接管，不改架构、不跳质量门。"
    next: retrieval
  - id: retrieval
    phase: "Phase 1"
    phase_seq: 2
    input: 01-任务简报.md（+ owner 已确认的语言/同意记录）
    kind: parallel_agents
    role: T1/T2/T3
    agents: [T1, T2, T3]
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output:
      T1: literature/文献卡.md
      T2: data/数据卡.md
      T3: cases/案例卡.md
    next: post_phase1_dispatch_verify   # v2.15.7：先过派发硬验证闸门再进 Phase 1.5
  - id: post_phase1_dispatch_verify
    phase: "Phase 1 后置（派发硬验证闸门）"
    phase_seq: 3
    # v2.15.7 新增：T1/T2/T3 全部 spawn 完成后，主控亲完成「派发清单硬验证」
    # 阻止「主控口头说已派发但实际无 sessions_spawn 返回值」的静默推进（ECS 2026-10-02 反馈）
    input: status.md 派发清单段（含 T1 / T2 / T3 三行 spawn 记录）
    kind: mechanical_checkpoint
    role: 主控
    owner: 主控
    write_authority: owner
    verification_authority: 主控
    check:
      - 必须存在 3 条派发行（对应 T1 / T2 / T3，每个一行）
      - 每行必含 runId + childSessionKey + resolvedModel 三字段（判据真源 = 00-主控-扩展职责.md §十六点五；字段名经 2026-10-02 实测校准）
      - 三条 runId 必须互不相同（防重复派发同一 session）
      - 三条 childSessionKey 必须互不相同且可解析为 sessions_history 可见记录
    verdict_scale: four_tier   # 与 v2.12.40 一致：通过 / 不通过 / 无法判定 / 路径或参数错误
    rerun_after_report: true   # v2.12.40「报告后激活」+ v2.15.8 债务补标：前提 = status.md 派发清单段已落盘；不得用预跑/上轮记录
    # 失败处置（不走 on_fail 路由键；两个失败档位都是 halt，不路由到其它节点）：
    #   路径或参数错误（派发清单缺失/字段空）⇒ halt + 报 post_dispatch_verify_path_error + 主控亲补 spawn
    #   不通过（runId/childSessionKey 重复或不可解析）⇒ halt + 报 post_dispatch_verify_conflict + 主人拍板
    output: status.md（追加「post_phase1_dispatch_verify 验证记录」段；行格式见 00-主控-扩展职责.md §十六点五）
    terminal_state_rules: {allowed: [passed, path_error, conflict, pending_owner], empty_output_is_success: false, halt_on_fail: true}
    recheck_record: status.md
    note: |
      v2.15.7 ECS 反馈：主控 spawn 后立即 yield，子代理实际从未启动 ⇒ 主控以「已派发」措辞回报，主人误判。
      本节点不 spawn；主控用 read 工具自检 status.md 派发清单段，符合所有 check ⇒ 写通过；任意 check 失败 ⇒ halt。
      与 00-主控-扩展职责.md §十六点五「派发硬验证」配对：那是 spawn 当次的判定；本节点是 yield 前的批量再确认。
    next: phase1_5_targeted_review
  - id: phase1_5_targeted_review
    phase: "Phase 1.5"
    phase_seq: 4
    kind: conditional_review_window
    verdict_scale: four_tier   # v2.12.40：结论落四档（通过/不通过/无法判定/路径或参数错误），不用退出码
    rerun_after_report: false   # 2026-10-08 审计 R-1：触发依据收窄为**任务简报标记**（Phase 0 输入，非下游报告）⇒ 无「报告后重判」需求；红数据触发项已移至 phase1_5b_post_t2_5_review（该节点排在 t2_5_integrity 之后）
    input: literature/文献卡.md + data/数据卡.md + cases/案例卡.md
    condition_undecidable: report_to_owner   # v2.12.54 R-6：条件证据不可判定 ⇒ 呈主人 + 按安全侧（触发）继续，禁止静默按 on_not_triggered 吞掉
    condition: phase1_5_brief_flag_trigger   # 激活逻辑：下方 trigger_conditions 命中即触发；全部未命中 → 走 on_not_triggered（v2.12.28 对齐）。2026-10-08 审计 R-1：本节点**只认简报标记**
    on_not_triggered: record_not_triggered_in_status
    owner_visible: true
    blocking: false
    trigger_conditions:
      - brief_marked_Dxx_for_review       # 命中定义：任务简报「需找数据点」段任一条目标注 [Dxx 待复核]（未标 = 不命中）
      - brief_marked_Lxx_for_review       # v2.13.0 P0-1：任务简报「待复核关键」段任一条目标注 [Lxx 待复核]（与 Dxx 同窗口；未标 = 不命中）
      # 2026-10-08 审计 R-1（B1）：`t2_5_red_data_unresolved` 已**移出本节点** —— 本节点 phase_seq=4 早于
      #   t2_5_integrity(5)，红数据在本时点不可得，恒为假且被 on_not_triggered 静默吞掉。现由
      #   phase1_5b_post_t2_5_review(6) 承担（排在该闸门之后）。
      # （已移除 t9_evidence_score_low：Phase 1.5 时点不可达，属占位条件 —— T9 评分低触发的回查在 Phase 4.5 后单独执行，见 phase-1-details.md）
    decisions: [triggered, not_triggered]
    output_if_triggered: literature/回查报告-vN.md
    required_record: status.md
    after_trigger: rerun_t2_5_integrity   # 动作名（非节点 id）：触发后重跑 t2_5_integrity 闸门
    next: t2_5_integrity
  - id: t2_5_integrity
    phase: "T2.5 完整性门"
    phase_seq: 5
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：结论落四档；「产物不存在」= 路径或参数错误（非内容缺陷、不触发修订）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = data/数据卡.md 已落盘；数据卡被补写后必须重跑
    owner: 主控
    write_authority: owner
    input: data/数据卡.md + cases/案例卡.md + literature/文献卡.md   # v2.12.40 补 P1-5：本闸门的判据对象必须显式声明（原未声明 input → 前置产物无人核对）
    next: phase1_5b_post_t2_5_review   # R-1(B1)：闸门后先过红数据求值点，未命中才进 T4；不得跳（否则 seq 6 不可达，门 S 断链）
  - id: phase1_5b_post_t2_5_review   # 别名：文档层「Phase 1.5 后置（T2.5 红数据窗口）」（非独立 Phase 标签，主控呈现时归入 Phase 1.5）
    phase: "Phase 1.5 后置（T2.5 红数据窗口）"
    phase_seq: 6
    kind: conditional_review_window
    verdict_scale: four_tier   # v2.12.40：结论落四档（通过/不通过/无法判定/路径或参数错误），不用退出码
    rerun_after_report: true   # 「报告后激活」：前提 = t2_5_integrity 判定已落盘；**必须在该判定写出之后**取数（预跑结果不得充当闸门输入）
    input: literature/文献卡.md + data/数据卡.md + cases/案例卡.md
    condition_undecidable: report_to_owner   # v2.12.54 R-6：条件证据不可判定 ⇒ 呈主人 + 按安全侧（触发）继续，禁止静默按 on_not_triggered 吞掉
    condition: phase1_5b_red_data_trigger   # 激活逻辑：下方 trigger_conditions 命中即触发；未命中 → on_not_triggered 留痕
    on_not_triggered: record_not_triggered_in_status
    owner_visible: true
    blocking: false
    trigger_conditions:
      - t2_5_red_data_unresolved          # 命中定义：t2_5_integrity 闸门报 🔴 二手转引未回溯到原始来源（M-Form-6 判定；未报红 = 不命中）
    decisions: [triggered, not_triggered]
    output_if_triggered: literature/回查报告-vN.md
    required_record: status.md
    after_trigger: rerun_t2_5_integrity   # 动作名（非节点 id）：触发后重跑 t2_5_integrity 闸门（回查改数后必须复判）
    note: 2026-10-08 审计 R-1（B1）：原单节点承载「简报标记 + T2.5 红数据」两类触发，却排在 t2_5_integrity 之前 ⇒ 红数据项首次到达**恒为假**、且被 on_not_triggered 记成「未触发」（与「闸门真没跑」不可分）。现拆两个求值点：简报标记留 seq 4、红数据入本节点（seq 6，排在闸门后）；各记一次 evaluated_against，命中出口同为 after_trigger。理由全文见 pipeline-overview.md 版本注记
    next: t4_analysis
  - id: t4_analysis
    phase: "Phase 2"
    phase_seq: 7
    input: literature/文献卡.md + data/数据卡.md + cases/案例卡.md
    kind: agent
    agent: T4
    role: T4
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output: analysis/分析大纲.md + analysis/T5-写作上下文.md   # T5 写作上下文包由 T4 产出（v2.12.37 审计 P1-1：原仅散落角色卡/派发话术，未入真源）
    output_chars_max: 12000   # 写盘上限（回传另受平台 4096 字符硬上限约束）
    next: phase2_5_outline
  - id: phase2_5_outline
    phase: "Phase 2.5"
    phase_seq: 8
    kind: owner_checkpoint
    blocking: true        # v2.12.49：无明确决策不得推进（改方向成本最低的关卡，尤其不得自动放行）
    owner_visible: true
    decisions: [approved, revision_requested, restart_phase]
    timeout_fallback: pending_owner_halt
    blocks: [t5_draft_v1]   # v2.15.13 FB-12：局部阻塞 —— 只阻塞写作层；Phase 1.5 定向回查（t1b_targeted_review）可与本等待并行（实测 2026-10-06：主控自行并行才没白等，规则化之）
    next: t5_draft_v1
  - id: t5_draft_v1
    phase: "Phase 3"
    phase_seq: 9
    input: analysis/分析大纲.md + analysis/T5-写作上下文.md
    kind: agent
    agent: T5
    role: T5
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output: drafts/初稿-v1.md
    next: phase3_5_insight
  - id: phase3_5_insight
    phase: "Phase 3.5"
    phase_seq: 10
    kind: owner_checkpoint
    blocking: true        # v2.12.49：「无补充」也是决策，必须留痕；静默不得当作无补充
    owner_visible: true
    decisions: [insight, direction_correction, no_insight]
    decision_contract: "direction_correction = 方向纠偏；记录 correction_scope，回 T5 重定向后才可进 current_draft_sync；不得把它降格为普通补充洞察。"
    timeout_fallback: pending_owner_halt
    blocks: [current_draft_sync, t6_critique]   # v2.15.13 FB-12：局部阻塞 —— 阻塞下游同步/批判层；上游产物整理（归档/心跳核对）可并行
    next: current_draft_sync
  - id: current_draft_sync   # 别名：文档层「Phase 3.6 前置」（非独立 Phase 标签，主控呈现时归入 Phase 3.6）
    phase: "Phase 3.6 前置"
    phase_seq: 11
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：结论落四档（本节点最常见失败 = 上游稿不存在 → 路径或参数错误档）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 上游最新稿已在磁盘；上游改写后必须重刷
    owner: 主控
    write_authority: owner
    output: drafts/current_draft.md
    note: 主控亲为（不 spawn）：同步当前权威稿至 drafts/current_draft.md，保留 draft_id / draft_version；下游默认只取指针与增量清单
    draft_ref_contract: {path: drafts/current_draft.md, required: [draft_id, draft_version, sha256, section_manifest, changed_sections], sha256_status: verified | unavailable, section_manifest_fields: [section, chars_or_bytes, locator], changed_sections_source: previous_synced_version, hash_mismatch: stop_and_request_resync, full_read_exceptions: [final_assembly, cross_section_audit, owner_explicit_request, incremental_validation_failed]}
    context_metrics: {required: [raw_input_bytes, structured_output_bytes, context_reduction_ratio, critical_evidence_preserved, locator_preserved, false_negative_count], compression_is_not_evidence: true}
    precondition: 上游最新稿（drafts/初稿-vN.md 或修订稿）+ Phase 3.5 洞察记录已在磁盘
    next: t6_critique
  - id: t6_critique   # 别名：文档层「Phase 3.6」（v2.12.40：G14 迁出至 Phase 4.4 前置，本节点仅 T6）
    phase: "Phase 3.6"
    phase_seq: 12
    kind: agent
    verdict_scale: four_tier
    agent: T6
    role: T6
    write_authority: owner   # v2.12.51 D-3：只读档报告由主控 write 落盘，本节点不授写权
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    degrade: skip_in_lite_tier   # P1-5 修复：轻量档 T6「必跳」在此声明（原键名 `t6_degrade`，v2.12.40 统一为标准键
                                 # `degrade`；真源缺声明时曾致各文件「必跳」/「可跳过」/「已声明为否」三种读法并存）
    input: drafts/current_draft.md
    output: analysis/批判报告-vN.md
    output_chars_max: 12000   # 批判报告（**写盘**上限；回传另受平台 4096 字符硬上限约束，超出走分块协议）
    next: t5_feedback_revision
