  <text x="480" y="345" fill="#a9b1d6">• Ran crew send --to neon "…"</text>
  <text x="480" y="369" fill="#c0caf5">› [from neon] 可以，注意分页参数</text>
  <text x="480" y="402" fill="#565f89">tmux: project-astra</text>

