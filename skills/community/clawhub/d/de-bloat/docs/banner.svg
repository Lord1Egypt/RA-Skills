<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="de-bloat 至简 - Reuse first. Just enough code. Evidence before done.">
  <defs>
    <style>
      text { white-space: pre; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .scan { animation: scan 3.6s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(146px); opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .p { opacity: 0; animation: flow 2.8s linear infinite; }
      .p2 { animation-delay: 0.7s; }
      .p3 { animation-delay: 1.4s; }
      .p4 { animation-delay: 2.1s; }
      @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(64px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .scan, .pulse, .blink, .p { animation: none; } .p { opacity: 0.8; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#160a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="neonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.78" cy="0.38" r="0.42">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.98" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.06" cy="0.04" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="330" width="1200" height="70" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/>
  <rect width="1200" height="400" fill="url(#glowV)"/>
  <rect width="1200" height="400" fill="url(#glowC)"/>
  <rect width="1200" height="400" fill="url(#glowM)"/>

  <g mask="url(#floorMask)" stroke="#818cf8" stroke-width="1" opacity="0.55">
    <path d="M0 336H1200M0 345H1200M0 357H1200M0 373H1200M0 394H1200"/>
    <path d="M600 330L600 400M600 330L375 400M600 330L825 400M600 330L150 400M600 330L1050 400M600 330L-75 400M600 330L1275 400M600 330L-300 400M600 330L1500 400"/>
  </g>

  <g class="mono">
    <text x="72" y="70" fill="#67e8f9" font-size="14" letter-spacing="5">// CODING SKILL FOR ANY AGENT</text>
    <text x="68" y="164" fill="url(#title)" font-size="92" font-weight="800" letter-spacing="3" filter="url(#glow)">DE-BLOAT</text>
    <text x="74" y="224" fill="#f5f3ff" font-size="44" font-weight="700" letter-spacing="12">至简</text>
    <text x="72" y="272" fill="#c7d2fe" font-size="17" letter-spacing="1.5">REUSE FIRST. JUST ENOUGH CODE. EVIDENCE BEFORE DONE.</text>
  </g>

  <g class="mono" font-size="12" letter-spacing="1">
    <rect x="72" y="294" width="52" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="85" y="311" fill="#a5f3fc">C++</text>
    <rect x="134" y="294" width="44" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="148" y="311" fill="#bae6fd">GO</text>
    <rect x="188" y="294" width="60" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="202" y="311" fill="#c7d2fe">JAVA</text>
    <rect x="258" y="294" width="76" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#c084fc" stroke-opacity="0.6"/>
    <text x="272" y="311" fill="#e9d5ff">PYTHON</text>
    <rect x="344" y="294" width="84" height="26" rx="13" fill="#1e293b" fill-opacity="0.7" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="358" y="311" fill="#fbcfe8">NODE.JS</text>
  </g>

  <rect x="740" y="48" width="420" height="256" rx="14" fill="url(#glass)" stroke="url(#neon)" stroke-opacity="0.7" stroke-width="1.5"/>
  <path d="M740 82H1160" stroke="#334155"/>
  <circle cx="764" cy="65" r="5.5" fill="#ff5f57"/>
  <circle cx="784" cy="65" r="5.5" fill="#febc2e"/>
  <circle cx="804" cy="65" r="5.5" fill="#28c840"/>
  <text class="mono" x="826" y="70" fill="#94a3b8" font-size="12" letter-spacing="1">de-bloat --apply</text>

  <text class="mono" x="764" y="102" fill="#f9a8d4" font-size="11" letter-spacing="3">BLOATED</text>
  <g fill="#22d3ee" opacity="0.18" transform="translate(3 0)">
    <rect x="764" y="112" width="150" height="8" rx="3"/>
    <rect x="764" y="128" width="118" height="8" rx="3"/>
    <rect x="764" y="144" width="164" height="8" rx="3"/>
    <rect x="764" y="160" width="104" height="8" rx="3"/>
    <rect x="764" y="176" width="140" height="8" rx="3"/>
    <rect x="764" y="192" width="126" height="8" rx="3"/>
    <rect x="764" y="208" width="170" height="8" rx="3"/>
    <rect x="764" y="224" width="112" height="8" rx="3"/>
    <rect x="764" y="240" width="150" height="8" rx="3"/>
  </g>
  <g fill="#f472b6" opacity="0.38">
    <rect x="764" y="112" width="150" height="8" rx="3"/>
    <rect x="764" y="128" width="118" height="8" rx="3"/>
    <rect x="764" y="144" width="164" height="8" rx="3"/>
    <rect x="764" y="160" width="104" height="8" rx="3"/>
    <rect x="764" y="176" width="140" height="8" rx="3"/>
    <rect x="764" y="192" width="126" height="8" rx="3"/>
    <rect x="764" y="208" width="170" height="8" rx="3"/>
    <rect x="764" y="224" width="112" height="8" rx="3"/>
    <rect x="764" y="240" width="150" height="8" rx="3"/>
  </g>
  <rect class="scan" x="756" y="108" width="190" height="2" fill="#67e8f9" filter="url(#soft)"/>

  <rect x="955" y="104" width="2" height="152" fill="url(#neonV)" filter="url(#soft)"/>
  <path d="M948 172l10 8-10 8" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#67e8f9">
    <circle class="p" cx="944" cy="140" r="2.5"/>
    <circle class="p p2" cx="944" cy="180" r="2.5"/>
    <circle class="p p3" cx="944" cy="220" r="2.5"/>
    <circle class="p p4" cx="944" cy="160" r="2.5"/>
  </g>

  <text class="mono" x="1000" y="150" fill="#67e8f9" font-size="11" letter-spacing="3">JUST ENOUGH</text>
  <g class="pulse" fill="#22d3ee" filter="url(#glow)">
    <rect x="1000" y="162" width="120" height="9" rx="3"/>
    <rect x="1000" y="180" width="86" height="9" rx="3" fill="#7dd3fc"/>
    <rect x="1000" y="198" width="104" height="9" rx="3" fill="#a5b4fc"/>
  </g>
  <rect class="blink" x="1112" y="196" width="8" height="13" fill="#e0f2fe"/>

  <g class="mono" font-size="11" letter-spacing="1.5">
    <rect x="764" y="266" width="84" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="778" y="282" fill="#a5f3fc">8 EVALS</text>
    <rect x="858" y="266" width="100" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="872" y="282" fill="#c7d2fe">ANY AGENT</text>
    <rect x="968" y="266" width="84" height="24" rx="12" fill="#0f172a" stroke="#e879f9" stroke-opacity="0.55"/>
    <text x="982" y="282" fill="#f5d0fe">NO DEPS</text>
  </g>

  <rect x="0" y="396" width="1200" height="4" fill="url(#neon)"/>
</svg>
