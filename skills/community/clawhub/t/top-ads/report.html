*{box-sizing:border-box}
body{margin:0;background:#f7f7fa;color:#201d30;font:15px/1.6 Inter,-apple-system,"PingFang SC",sans-serif}
main,header>div{max-width:1220px;margin:auto;padding:0 4vw}
header{background:white;border-bottom:1px solid #dfdee8}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
article{border:1px solid #e1dee8;border-radius:14px;background:white;overflow:hidden;box-shadow:0 2px 6px #22134408}
.media{position:relative;display:block;background:#17161b;color:white}
.media img{display:block;width:100%;height:182px;object-fit:contain}
.rank,.action{position:absolute;border-radius:6px;background:#191721e8;color:white;font-size:12px;padding:2px 8px}
.rank{left:9px;top:9px;font-weight:750}
.action{right:9px;bottom:9px}
.copy{padding:12px 15px 16px}
.copy small{color:#686375}
h3{margin:3px 0 8px;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.platform{font-size:12px;color:#575166}
a:focus-visible{outline:3px solid #7952ef;outline-offset:-3px}
dl{display:flex;gap:20px;border-top:1px solid #eeeaf5;margin:12px 0 0;padding-top:8px}
dt{font-size:12px;color:#655e70}
dd{margin:0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
article.card{position:relative;cursor:pointer}
article.card:hover,article.card:focus-within{outline:2px solid #8265c7}
.hit{position:absolute;inset:0;border:0;background:transparent;width:100%;cursor:pointer}
dl{gap:12px;justify-content:space-between}
dd{font-size:15px}
dialog{width:min(1030px,94vw);max-height:90vh;overflow:auto;border:0;border-radius:20px;padding:0;color:#252332;background:#fbfafc}
dialog::backdrop{background:#161221b8}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #dedbe6}
.bar button{font-size:24px;background:none;border:0;cursor:pointer}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.stage{background:#201e29;display:grid;place-items:center;min-height:330px;padding:12px}
.stage img,.stage video{width:100%;max-height:64vh;object-fit:contain}
.side{padding:20px;min-width:0}
.tabs{display:flex;gap:3px;border-bottom:1px solid #ddd;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 5px;cursor:pointer;color:#514d60}
.tabs [aria-selected=true]{color:#54358c;border-color:#7852b2;font-weight:700}
.panel{padding:18px 0;max-height:44vh;overflow:auto}
.panel table{border-collapse:collapse;width:100%;font-size:14px}
.panel td,.panel th{padding:6px 8px;border-bottom:1px solid #e9e6ed;text-align:left}
.cta{display:inline-block;background:#55338b;color:white;text-decoration:none;border-radius:8px;padding:9px 17px}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e9e6ed;padding:7px 0}
.row b{text-align:right}
#rising h2{color:#087450}
#trending h2{color:#ac520e}
#new h2{color:#69459e}
@media(max-width:700px){.split{grid-template-columns:1fr}
.stage{min-height:100px}
.stage img,.stage video{max-height:35vh}
.side{padding:12px}
.panel{max-height:32vh}
}

const t = vocabulary[data.language].split('|');
document.documentElement.lang = data.language;
const main = document.querySelector('main');
const dlg = document.querySelector('dialog');
const stage = dlg.querySelector('.stage');
const tabs = dlg.querySelector('.tabs');
const panel = dlg.querySelector('.panel');
const charts = ['trending','rising','new'];
const fmt = new Intl.NumberFormat(data.language,{maximumFractionDigits:4});
function add(parent, tag, text, cls) {
 const el = document.createElement(tag);
 if (cls) el.className = cls;
 if (text != null) el.textContent = text;
 parent.append(el);
 return el;
}
function number(n, signed=false, unit='') {
 return typeof n === 'number' ? (signed && n>0 ? '+' : '')+fmt.format(n)+unit : '—';
}
function fields(chart, ad) {
 const scores = chart==='rising' ? [[t[6],number(ad.increment,true)],[t[7],number(ad.rate,true,'%')]] : [[t[5],number(ad.score)]];
 return [...scores,[t[8],number(ad.days)]];
}
function picture(parent, ad) {
 if (!ad.preview) return;
 const img = add(parent,'img');
 img.alt = ad.title || ad.advertiser || '';
 img.src = ad.preview;
}
const heading = t[data.category==='game'?0:1];
document.title = 'Denote · '+heading;
add(main,'h1',heading);
add(main,'time',data.start+' — '+data.end+' · Asia/Shanghai');
const nav = add(main,'nav');
let active, activeChart;
function createCard(grid, chart, ad) {
 const card = add(grid,'article',null,'card');
 const media = add(card,'div',null,'media');
 picture(media, ad);
 add(media,'span','#'+ad.rank,'rank');
 add(media,'span',ad.video?'▶ '+t[24]:ad.format==='video'?t[26]:t[25],'action');
 const copy = add(card,'div',null,'copy');
 add(copy,'small',ad.advertiser || '—');
 const title = ad.title || ad.advertiser || ad.key;
 add(copy,'h3',title);
 add(copy,'div',ad.platforms.join(' · '),'platform');
 const dl=add(copy,'dl');
 for(const [label,value] of fields(chart,ad)) {
  const pair=add(dl,'div');add(pair,'dt',label);add(pair,'dd',value);
 }
 const btn=add(card,'button',null,'hit');
 btn.setAttribute('aria-label','#'+ad.rank+' '+title);
 btn.onclick=()=>openCard(chart,ad,title);
}
charts.forEach((chart,i)=>{
 add(nav,'a',t[i+2]).href='#'+chart;
 const section=add(main,'section');section.id=chart;
 const rows=data.charts[chart];
 add(add(section,'div',null,'head'),'h2',t[i+2]+' · '+rows.length);
 const grid=add(section,'div',null,'grid');
 rows.forEach(ad=>createCard(grid,chart,ad));
});
function select(i) {
 [...tabs.children].forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1});
 panel.replaceChildren();panel.setAttribute('aria-labelledby','tab'+i);
 const state=active.states[i];
 const note=()=>add(panel,'p',t[state==='locked'?23:state==='empty'?21:22],'notice');
 if(i===0) {
  if(state!=='ok') note();
  for(const [label,value] of [[t[14],active.advertiser],[t[15],active.platforms.join(' · ')],...fields(activeChart,active)]) {
   const row=add(panel,'div',null,'row');add(row,'span',label);add(row,'b',value || '—');
  }
  return;
 }
 const rows=[active.trend,active.related,active.audience][i-1];
 if(!rows.length){note();return}
 const table=add(panel,'table'), header=add(add(table,'thead'),'tr');
 for(const label of [[t[16],t[17]],[t[18],t[15]],[t[19],t[20]]][i-1]) add(header,'th',label);
 const body=add(table,'tbody');
 for(const values of rows){
  const row=add(body,'tr');
  values.forEach(v=>add(row,'td',typeof v==='number'?number(v):v??'—'));
 }
}
t.slice(9,13).forEach((label,i)=>{
 const btn=add(tabs,'button',label);btn.id='tab'+i;btn.setAttribute('role','tab');btn.setAttribute('aria-controls','info');
 btn.onclick=()=>select(i);
 btn.onkeydown=e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const j=(i+(e.key==='ArrowLeft'?3:1))%4;select(j);tabs.children[j].focus()};
});
const link=dlg.querySelector('.cta');link.textContent=t[13]+' ↗';
function openCard(chart,ad,title){
 active=ad;activeChart=chart;dlg.querySelector('strong').textContent=title;
 stage.replaceChildren();
 if(ad.video){const v=add(stage,'video');v.controls=true;v.playsInline=true;v.preload='none';if(ad.preview)v.poster=ad.preview;v.src=ad.video}
 else picture(stage,ad);
 link.href='https://denote.net/workspace/'+chart+'-ads?category='+(data.category==='game'?'game':'tool');
 select(0);dlg.showModal();
}
const close=dlg.querySelector('#close');close.setAttribute('aria-label',t[27]);close.onclick=()=>dlg.close();
dlg.onclose=()=>{const v=stage.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}stage.replaceChildren()};
</script></html>
