description: Classify, score, prioritize, and batch notifications. ⚠️ Auto-creates persistent per-source rules on first classification (a single misclassification persists forever). Ignored notifications are silently dropped but logged to dropped.json. Digest summarizes the batch queue and does NOT clear it. Destructive ops (--rules clear/remove, --seen --all) require --force. All writes are atomic. Hard caps: batch≤5000, dropped≤1000.
