<h1 class="onbar" data-k="title" style="left:48px;top:13px;width:1093px">内积空间：以实内积空间（欧氏空间）为例</h1>
<div class="block" style="left:80px;top:128px;width:747px;height:373px">
  <div class="block-title">定义内积要满足的公理</div>
  <div class="block-body">
    <p>交换律：<span data-tex="\langle u,v\rangle=\langle v,u\rangle"></span></p>
    <p>数乘：<span data-tex="\langle \alpha u,v\rangle=\alpha\langle u,v\rangle"></span></p>
    <p>加法：<span data-tex="\langle u+v,w\rangle=\langle u,w\rangle+\langle v,w\rangle"></span></p>
    <p>正定：<span data-tex="\langle u,u\rangle\ge 0"></span>，等号仅当 <span data-tex="u=0"></span></p>
  </div>
</div>
<div class="note" data-enter="fade" data-enter-delay="240" style="left:880px;top:144px;width:373px;text-align:left">模（范数的一种）</div>
<div class="formula big" data-enter="fade" data-enter-delay="240" style="left:880px;top:200px;width:373px;text-align:left"><span data-tex="\displaystyle \|x\|_2=\sqrt{\langle x,x\rangle}"></span></div>
<div class="formula big" data-enter="fade" data-enter-delay="240" style="left:880px;top:277px;width:373px;text-align:left"><span data-tex="\displaystyle =\left(\sum_{i=1}^{n}x_i^2\right)^{\frac{1}{2}}"></span></div>
