    condition: T6_requires_revision   # 命中 = 报告头部「P0/P1 否决项清单」非空（高可攻击性/砍论点 ⇒ 否决项）
    on_not_triggered: record_not_triggered_in_status   # v2.12.28：未触发也必须在 status.md 留痕（防「未触发」与「漏跑」不可分）
    after_each: [current_draft_sync]   # P2-1：本节点非 bounded_loop，`after_each` = 单次执行后刷新。产出 v{N+1} 后必须刷新 current_draft.md，否则 T7 读旧稿。
