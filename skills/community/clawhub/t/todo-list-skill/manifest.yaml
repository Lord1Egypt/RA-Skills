# todos/manifest.yaml
# Skill 元数据文件（qwenpaw skills list 识别用）
# 参考：qwenpaw 官方 skill 格式 + anthropics/skills manifest

schema_version: "1.0"
name: todo-list
version: "1.5.0"
display_name: "TODO 清单管理"
description: >
  在钉钉对话中维护跨会话 TODO 清单，支持自然语言添加、时间提醒、优先级、标签、定时推送，
  以及与 ETF 量化报告联动。

author: "月海巫师"
created: "2026-06-11"
updated: "2026-06-11"

# 触发词（让 agent 识别何时调用此 skill）
trigger:
  keywords:
    - "提醒我"
    - "加个待办"
    - "我的待办"
    - "今天有什么待办"
    - "完成了"
    - "删除那条"
    - "记一下"
    - "todos"
    - "todolist"
    - "todo list"
  aliases:
    - "add todo"
    - "show todos"
    - "list todos"
    - "check todos"

# 触发场景（触发时的上下文）
trigger_on:
  contexts:
    - "钉钉对话"
    - "个人任务管理"
    - "ETF 持仓管理"
    - "定时提醒需求"
  exclude_contexts:
    - "团队协作"
    - "日历同步"
    - "项目管理（多人）"

# 依赖（安装前检查）
dependencies:
  python_packages:
    - name: "python-dateutil"
      version: ">=2.8.0"
      required: true
      note: "时间解析，标准库 datetime 的补充"
    - name: "jieba"
      version: ">=0.42.0"
      required: false
      note: "中文分词，可选，无则用正则替代"
  system:
    - name: "sqlite3"
      note: "Python 标准库，无需额外安装"
  skills:
    - name: "channel_message"
      note: "钉钉推送，需要已配置钉钉 channel"
    - name: "cron"
      note: "定时提醒，需要 qwenpaw cron 支持"

# 文件入口（agent 调用入口）
entry:
  main: "src/cli.py"
  init: "python -m src.cli init"
  test: "python -m pytest tests/ -v"

# 权限需求
permissions:
  filesystem:
    - path: "todos/"
      access: "read_write"
      note: "数据库和备份存储"
    - path: "todos/config.json"
      access: "read_write"
      note: "v1.5.0 提醒通道配置（运行时生成）"
    - path: "/tmp/"
      access: "write"
      note: "降级 fallback 文件"
  network:
    - url: "dingtalk webhook"
      access: "write_only"
      note: "钉钉消息推送（v1.5.0 降级通道）"
  cron:
    access: true
    note: "注册定时任务（v1.5.0 + WorkBuddy Automation 整合）"

# 状态（发布状态）
status: "stable"  # v1.5.0 评估 9.00 S，主体功能完成
license: "MIT"
repository: ""  # 留空，本地开发无远端

# 标签（用于搜索/分类）
tags:
  - "todo"
  - "reminder"
  - "task-management"
  - "dingtalk"
  - "productivity"
  - "etf"

# 健康检查
health_check:
  command: "python -m src.cli list"
  expected_output: "今日待办"
  timeout: 5

