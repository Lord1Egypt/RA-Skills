<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillFlowChart 执行决策流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; color: #e0e0f0; }
    .subtitle { font-size: 13px; color: #8888aa; margin-bottom: 16px; }
    svg { max-width: 760px; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>SkillFlowChart · AI 执行决策流程图</h1>
  <p class="subtitle">AI 提取语义，脚本计算几何</p>
<svg viewBox="-60.0 0 550.0 816.0" width="100%" role="img">
  <title>SkillFlowChart 执行决策流程图</title>
  <rect x="-60.0" y="0" width="550.0" height="816.0" fill="#0a0a0f"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2a2a3e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: system-ui, sans-serif; font-size: 14px; fill: #e0e0f0; }
    .ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #8888aa; }
    .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #e0e0f0; }
    .ths { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #e0e0f0; }
    .edge { fill: none; stroke: #2a2a3e; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #1a1a2e; stroke-width: 0.8; stroke-dasharray: 4 3; }
  </style>
  <line class="edge" x1="340.0" y1="76.0" x2="340.0" y2="108.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="164.0" x2="340.0" y2="196.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.0" y1="226.0" x2="200.0" y2="226.0" marker-end="url(#arrow)"/>
  <text class="ts" x="232.5" y="218.0" text-anchor="middle" paint-order="stroke" stroke="#0a0a0f" stroke-width="3">否</text>
  <line class="edge" x1="340.0" y1="368.0" x2="340.0" y2="400.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.0" y1="430.0" x2="150.0" y2="430.0" marker-end="url(#arrow)"/>
  <text class="ts" x="207.5" y="422.0" text-anchor="middle" paint-order="stroke" stroke="#0a0a0f" stroke-width="3">失败</text>
  <line class="edge" x1="340.0" y1="460.0" x2="340.0" y2="516.0" marker-end="url(#arrow)"/>
  <text class="ts" x="340.0" y="482.0" text-anchor="middle" paint-order="stroke" stroke="#0a0a0f" stroke-width="3">通过</text>
  <line class="edge" x1="340.0" y1="572.0" x2="340.0" y2="604.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="256.0" x2="340.0" y2="292.0"/>
  <line class="edge" x1="90.0" y1="248.0" x2="90.0" y2="292.0"/>
  <line class="edge" x1="90.0" y1="292.0" x2="340.0" y2="292.0"/>
  <line class="edge" x1="340.0" y1="292.0" x2="340.0" y2="312.0" marker-end="url(#arrow)"/>
  <rect x="230.0" y="32.0" width="220" height="44" rx="10" fill="#1a1a2e" stroke="#6c63ff" stroke-width="0.5"/>
  <text class="th" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">用户触发</text>
  <rect x="230.0" y="108.0" width="220" height="56" rx="8" fill="#1a1a2e" stroke="#6c63ff" stroke-width="0.5"/>
  <text class="th" x="340.0" y="129.0" text-anchor="middle" dominant-baseline="central">定位 SKILL.md</text>
  <text class="ts" x="340.0" y="146.0" text-anchor="middle" dominant-baseline="central" fill="#8888aa">查找路径 / 询问用户</text>
  <polygon points="340.0,196.0 415.0,226.0 340.0,256.0 265.0,226.0" fill="#1a1a2e" stroke="#ffa94d" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="226.0" text-anchor="middle" dominant-baseline="central">SKILL.md 存在？</text>
  <rect x="-20.0" y="204.0" width="220" height="44" rx="8" fill="#1a1a2e" stroke="#6c63ff" stroke-width="0.5"/>
  <text class="th" x="90.0" y="226.0" text-anchor="middle" dominant-baseline="central">询问路径</text>
  <rect x="230.0" y="312.0" width="220" height="56" rx="8" fill="#1a1a2e" stroke="#6c63ff" stroke-width="0.5"/>
  <text class="th" x="340.0" y="333.0" text-anchor="middle" dominant-baseline="central">AI 提取 nodes.json</text>
  <text class="ts" x="340.0" y="350.0" text-anchor="middle" dominant-baseline="central" fill="#8888aa">语义理解 → 结构化数据</text>
  <polygon points="340.0,400.0 415.0,430.0 340.0,460.0 265.0,430.0" fill="#12121a" stroke="#51cf66" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="430.0" text-anchor="middle" dominant-baseline="central">校验通过？</text>
  <rect x="30.0" y="408.0" width="120" height="44" rx="8" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="0.5"/>
  <text class="th" x="90.0" y="430.0" text-anchor="middle" dominant-baseline="central">输出校验错误</text>
  <rect x="230.0" y="516.0" width="220" height="56" rx="8" fill="#12121a" stroke="#51cf66" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="537.0" text-anchor="middle" dominant-baseline="central">脚本渲染 HTML</text>
  <text class="ts" x="340.0" y="554.0" text-anchor="middle" dominant-baseline="central" fill="#51cf66">坐标计算 + SVG + CSS</text>
  <rect x="230.0" y="604.0" width="220" height="56" rx="10" fill="#12121a" stroke="#00d4aa" stroke-width="0.5"/>
  <text class="th" x="340.0" y="625.0" text-anchor="middle" dominant-baseline="central">输出流程图</text>
  <text class="ts" x="340.0" y="642.0" text-anchor="middle" dominant-baseline="central" fill="#00d4aa">自包含 HTML · 零依赖</text>
  <line x1="-20.0" y1="724.0" x2="450.0" y2="724.0" stroke="#1a1a2e" stroke-width="0.5"/>
  <text class="ts" x="215.0" y="736.0" text-anchor="middle" dominant-baseline="central">图例</text>
  <rect x="12.0" y="748.0" width="94" height="24" rx="6" fill="#1a1a2e" stroke="#6c63ff" stroke-width="0.5"/>
  <text class="ts" x="59.0" y="760.0" text-anchor="middle" dominant-baseline="central">AI 执行</text>
  <rect x="118.0" y="748.0" width="94" height="24" rx="6" fill="#12121a" stroke="#00d4aa" stroke-width="0.5"/>
  <text class="ts" x="165.0" y="760.0" text-anchor="middle" dominant-baseline="central">输出/报告</text>
  <rect x="224.0" y="748.0" width="66" height="24" rx="6" fill="#1a1a2e" stroke="#ffa94d" stroke-width="0.5"/>
  <text class="ts" x="257.0" y="760.0" text-anchor="middle" dominant-baseline="central">决策点</text>
  <rect x="302.0" y="748.0" width="52" height="24" rx="6" fill="#12121a" stroke="#51cf66" stroke-width="0.5"/>
  <text class="ts" x="328.0" y="760.0" text-anchor="middle" dominant-baseline="central">脚本</text>
  <rect x="366.0" y="748.0" width="52" height="24" rx="6" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="0.5"/>
  <text class="ts" x="392.0" y="760.0" text-anchor="middle" dominant-baseline="central">终止</text>
</svg>
</body>
</html>
