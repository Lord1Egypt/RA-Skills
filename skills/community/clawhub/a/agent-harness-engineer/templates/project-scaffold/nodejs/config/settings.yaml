# 类型: 用户配置
# 说明: Agent主配置文件
# 修改建议: 根据实际需求修改配置项

# LLM配置
llm:
  provider: "anthropic"  # anthropic | openai | azure | local
  model: "claude-sonnet-4-20250514"
  api_key: "${ANTHROPIC_API_KEY}"  # 从环境变量读取
  base_url: null  # 自定义API端点（本地模型需要）
  max_tokens: 4096
  temperature: 0.7

# Agent配置
agent:
  name: "my-agent"
  description: "一个智能编码助手"
  max_turns: 50
  context_window: 200000

# 工具配置
tools:
  enabled:
    - "file_tools"
    - "network_tools"
    - "browser_tools"
  disabled: []

# 权限配置
permissions:
  mode: "ask"  # allow | deny | ask
  rules:
    - pattern: "Bash(rm -rf *)"
      action: "deny"
    - pattern: "Bash(sudo *)"
      action: "deny"
    - pattern: "Bash(git push --force *)"
      action: "deny"
    - pattern: "Bash(git reset --hard*)"
      action: "deny"

# 沙箱配置
sandbox:
  enabled: true
  allowed_directories:
    - "workspace/"
  denied_patterns:
    - ".env"
    - ".env.*"
    - "*.key"
    - "*.pem"
    - "secrets/"

# 记忆配置
memory:
  enabled: true
  storage: "memory/"
  max_size: "100MB"
  auto_compact: true

# 日志配置
logging:
  level: "info"  # debug | info | warning | error
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agent.log"
