# 背景：整族计数散落全仓（「G14 9 类」多处、「13 类常见错误」、「24 中文 + 12 英文」、
#   「dispatch 11 文件」等）。此前靠**人记住 N 个地方**同步 —— 2026-09-25 审计实测已出现
