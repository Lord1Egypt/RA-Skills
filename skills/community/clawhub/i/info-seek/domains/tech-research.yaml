# 技术研究领域 Profile (v1.9.0，P0-OPEN-05 按域收窄)

> 面向**通用技术研究**：既覆盖制造工艺（钢铁/化工/机械/电子），
> 也覆盖 AI/软件/互联网技术（大模型、GPT 类产品、算法、架构、芯片等）。
> 模板见 domains/templates.yaml#tech-research（v3.2.0 起去除钢铁硬编码）。

## 适用场景
- AI / 软件 / 互联网技术调研（如 GPT 类模型、Agent、开源框架、算法架构）
- 工艺技术文献调研（如钢卷分切工艺、热处理工艺）
- 设备参数选型（如圆盘刀重叠量、切割速度、压辊力）
- 缺陷原因排查（如宽度不均、毛刺、波浪纹）
- 工艺改进方案（如锥度张力调优、刀轴精度校准）

## 信任源白名单（Tier 1）
| 类型 | 来源 | 权重 |
|:-----|:-----|:-----|
| 学术 | 知网/万方/PubMed/Google Scholar | +20 |
| 标准 | 国标 GB / 行业标准 / ISO / ASTM | +25 |
| 头部企业 | 宝钢、首钢、河钢、ArcelorMittal、Posco | +15 |
| 设备厂商 | SMS group、Andritz、Mitsubishi-Hitachi | +15 |
| 行业协会 | 中国金属学会、MPIF、AIST | +10 |

## 关键词模板
```yaml
template: "{材料} {工序} {工艺参数 OR 缺陷 OR 设备}"
examples:
  - "钢卷分切 圆盘刀 重叠量"
  - "SUS316L 退火 工艺参数"
  - "热轧带钢 厚度公差 缺陷原因"
```

## 评分权重微调
```yaml
Anchor_Score:
  interaction: 0.15      # 默认 0.20，工艺文献互动量不重要
  topic_match: 0.30      # 默认 0.30
  credibility: 0.45      # 默认 0.40，技术领域看重一手来源
  llm_readability: 0.10  # 默认 0.10
```

## 输出格式

```markdown
## 技术工艺调研报告

### 1. 工艺流程
- 关键工序流程图（文字描述）
- 工艺参数表（材料/设备/参数范围/来源）

### 2. 风险点 & 排查决策树
- 维度 1：[风险描述]
  - 流出原因 1：[条件]
  - 流出原因 2：[条件]
  - 排查路径：[步骤]
- 维度 2：...

### 3. 工艺参数推荐
| 参数 | 推荐范围 | 出处 | 适用条件 |
|:-----|:---------|:-----|:---------|
```

## 关联 Skill
- 检测到"钢/铝/铜/合金等金属"+"分切/轧制/退火"→ 自动启用 tech-research profile
- 检测到"化学/分子式/反应"→ 切换 profile


