  <text x="40" y="346" fill="#9ece6a">⏺ 已保存，双击 .command 恢复</text>
  <text x="40" y="402" fill="#565f89">tmux: project-main（恢复后）</text>

  <!-- neon -->
  <text x="480" y="78" fill="#7dcfff" font-weight="bold">neon</text>
  <text x="524" y="78" fill="#565f89">agy · Gemini 4 Neon · high</text>
