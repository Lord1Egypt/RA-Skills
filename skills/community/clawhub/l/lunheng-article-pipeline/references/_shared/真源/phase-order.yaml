    on_not_triggered: record_not_triggered_in_status   # v2.12.37 审计 P1-3：图位=0 时必须留痕，防「未触发」与「漏跑」不可分
    note: |
      主控亲为（不 spawn）：按 Phase 2.5 拍板数手写 SVG（templates/图表-SVG-template.md），零外发。
      **v2.12.49 M-11**（4 条语义锁）：
      1. **拍板 N > 0 ⇒ 必产出 N 张 SVG**（零外发、零 exec）；拍板有图却未产出 = 不合格。
      2. **output 仅 N 张**；图位超取（拍板 3 张写了 5 张）或图位不足（拍板 5 张写了 3 张）均不合格。
      3. **T4 不取定 0**：「0」必须由主人在 Phase 2.5 显式拍板；T4 仅出「建议」不出一决定。
      4. **status.md 必含 owner_figure_decision 记录**（采用 T4 建议 / 调整图位数 / 取消图表三选一）；缺失 = 不合格。
      5. **图件生成/转换/去留**与 **SVG 写图** 是**两类不同职责**：生成与转换（PNG）主人手动（v2.12.49 零 exec 边界）；**写 SVG**仍是论衡职责（主控 write 纯文本），不得移出。
      6. **v2.12.60 图件嵌入锁**（主人 2026-09-19 裁定「图件如果存在要机械嵌入」）：本节点产出的 N 张 SVG，**必须由 `final_assembly` 以 `![图N：标题](图件/图N_标题.svg)` 形态嵌入** `final/定稿.md`（嵌入计数 = 拍板 N）；只写纯文本 `[图N：标题]` 占位 = 不合格。嵌入属论衡职责（主控 `write`，零 exec）；PNG 转换仍归主人。
    next: final_assembly
  - id: final_assembly   # 别名：文档层「Phase 4.4 后置」/ 定稿组装（非独立 Phase 标签，主控呈现时归入 Phase 4）
    phase: "Phase 4.4 后置（定稿组装）"
    phase_seq: 21
    input: drafts/current_draft.md + data/数据卡.md + final/图件/*.svg（图件存在时用于嵌入）
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：组装前置核验结论落四档（当前稿不存在 = 路径或参数错误）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 当前权威稿已落盘；上游改写后必须重新组装
    owner: 主控
    write_authority: owner
    output: final/定稿.md
    fingerprint: required   # v2.12.49 M-1：产出后必须写 final/定稿.sha256（主控 read + 主人 host shell 补算 sha256sum 写入）；指纹真源
    post_assembly_checks: [g14_caption_recheck]
    post_assembly_recheck: required
    recheck_record: status.md
    note: 主控组装 final/定稿.md；图件存在时必须按 `![图N：标题](图件/图N_标题.svg)` 嵌入且计数等于拍板 N。组装后必做 `g14_caption_recheck`：核对最终图位数量、图注—数据卡对应关系、图注是否引入未登记新主张与 Markdown 嵌入形态，结果写 status.md；未完成/不可判定不得进入 t9_review。该复核只覆盖组装新增/变形的图注图位文本，不替代 G14 首审。
    next: t9_review
  - id: t9_review   # 别名：文档层「Phase 4.5」
    phase: "Phase 4.5"
    phase_seq: 22
    kind: advisory_agent
    verdict_scale: four_tier   # v2.12.40：T9 报告判定落四档
    fingerprint: required   # v2.12.49 M-1：报告必填 audited_artifact.{path,bytes,sha256}
    audited_artifact_required: true   # v2.12.49 M-1/M-8：以下游只读档报告必须声明三元组
    # v2.12.40 业主定案 A2：输入由 `drafts/current_draft.md`（未定稿稿件）改为 **`final/定稿.md`（终稿）**——
    #   T9 定位为「**终稿落成后模拟投递刊物编辑审稿**」。节点位于 final_assembly 之后，故「终稿落成后」已满足。
    input: final/定稿.md
    default: triggered                      # v2.12.54 S-1（Batch A 夹带的最小真源修复）：由 opt-in（owner_peer_review_consent，**全仓无生产方**）改为**默认启用**，写法同 methodology_snapshot
    opt_out: owner_peer_review_opt_out      # 主人显式 opt-out 的条件键（真源 = condition_definitions）
    on_opt_out: record_opt_out_in_status    # 主人显式退出 ⇒ 记 `opt_out`（**不得**记 `not_triggered`，两者语义不同）
    recheck_max_rounds: 0   # T9 无复检回环（盲审仅一次、无重跑场景）；显式登记 0 = 派发合同块取数源（原为代码侧无源常量，架构评审 v3 R2② 收口）
    condition_undecidable: report_to_owner  # v2.12.54 R-6：opt-out 记录缺失/不可判定 ⇒ 按默认启用继续 + 呈主人，不静默跳过整节点
    # v2.12.46 口径修正：体裁不再机械门控，公众号亦可由主人显式开启（体裁仅供主人参考、非门控）。
    # blocking:false = T9 是「建议性同行评审」，其评分/期刊/扩写建议不阻塞交付（采纳权在主人）；
    # 但仍顺序排在 t8 之前，因 T8 终检需读 T9 报告做「T9 建议分流」（minor inline / major 呈主人拍板）。
    blocking: false
    role: T9
    write_authority: owner   # v2.12.51 D-3：只读档报告由主控 write 落盘，本节点不授写权
    verification_authority: 主控
    # ⚠️ v2.12.55 S-2：本节点**不写** `on_worker_failure`（通用 fallback = 主控接管）——
    #   盲审在结构上不可能由主控接管：主控已读遍全部内部材料，代笔即独立性归零且**事后不可修复**。
    #   旧实况（v2.12.54 前）：通用 fallback 与下方 `independence_rules`「禁主控代笔」**两条互斥条款并存**，
    #   实测被读成「主控代写审稿报告并给出编造精度」。失败处置**唯一出口** = `independence_failure_policy`。
    # ↓ v2.12.40 业主定案 A2：T9 独立性**硬定义**（不是建议、不得自行放宽）——错一处即报告失效
    independence: blind_review
    independence_rules:
      - 必须 spawn 为**独立子代理**（禁主控代笔；主控只做派发、收报告、落盘拼装）
      - 输入白名单**仅两项**：final/定稿.md + 任务简报「投稿信息」子集（目标期刊 / 栏目 / 字数上限）
      - 禁止读取内部过程材料（读取即独立性违反）：literature/文献卡.md、data/数据卡.md、cases/案例卡.md、
        analysis/分析大纲.md、analysis/批判报告-vN.md、audits/G14-检测报告-vN.md、audits/审计报告-vN.md、final/M-Gate-Report-*.json
      - 报告必须含必填字段「独立性声明」（声明未读上述任何材料 + 声明本文为盲审）
      - 评分与判定**不得引用任何内部报告**（引用即报告降为无效，必须重跑）
      - 不得以「参考 T7 的 G1 核验产物」为名回读内部报告（v2.12.40 删除了该旧口径）
    required_report_field: 独立性声明
    # ⚠️ v2.12.55 S-2：盲审失败处置的**唯一出口** —— 只能重试 spawn，禁主控代笔（与上条互斥条款一并删除）。
    independence_failure_policy:
      on_spawn_failure: retry_spawn_only        # 唯一合法恢复动作 = 重新 spawn 独立子代理（可同时换 provider 族 / 能力档）
      retry_limit: 2                            # 可调（主人可上调）；**不得**降为 0 后改由主控代笔
      quota_class_retry: not_homogeneous        # v2.15.13（反哺 FB-11，实测 2026-10-06）：429 quota / 402 余额类失败属资源层故障，**不计入 retry_limit**（换族重试优先，真源 = route_tier.md §四）；实测 T9 第 1 次 429 后跨族重试成功且独立性反而达成
      cross_family_retry: first_class_action    # v2.15.13（反哺 FB-11）：跨 provider 族重试为一级动作（与 on_spawn_failure 同级可选），优先于同族重试（候选池 §三换族优先）
      executor_takeover: forbidden              # 禁主控代笔：主控已读全部内部材料，代笔 = 盲审失效
      forbidden_recovery: [owner_ghostwriting, owner_synthesized_report, digest_existing_internal_reports]
      on_exhausted: record_missing_and_notify_owner   # 重试仍失败 ⇒ 记为缺失 + 显式告知主人
      status_record: missing_blind_review       # status.md 记 missing_blind_review（**不得**记 Done / accepted）；T9 缺失时交付说明写法 = 显式「T9 未产出（missing_blind_review）+ 失败时间线 + 主人已知会」三要素，**不得**留空或写「已评审」（v2.15.13 补替代呈现格式，反哺 FB-11③）
      downstream: 下游 t8_technical_final 必须显式标注「审稿报告缺失」，交付说明**不得**出现任何 T9 结论 / 评分 / 期刊匹配（无来源精度 = 编造）
    terminal_state_rules: {allowed: [worker_running, worker_failed, worker_timeout, missing_blind_review, done], empty_output_is_success: false, executor_takeover: forbidden, missing_report_blocks_t9_claims: true}
    output: audits/审稿报告-vN.md
    output_chars_max: 15000
    dispatch: references/dispatch/T9-同行评审.md   # 派发话术合同块载体；合同面由生成器从本字段现算
    next: t9b_stress_test
  - id: t9b_stress_test
    phase: "Phase 4.5 后置（压力测试轮）"
    phase_seq: 23
    kind: owner_agent
    owner: 主控
    write_authority: owner
    verification_authority: 主控
    input: final/定稿.md + audits/审稿报告-vN.md
    output: audits/压力测试报告-vN.md
    # 2026-10-05（架构评审 v3 R2 附带裁决）：默认触发 → **opt-in**。
    #   依据：实跑 40+ 项目零产出（管线越过该位置而报告不存在）；产出无下游消费方
    #   （T8/交付说明/status 皆不读）；主控亲为 = 重读定稿全文 ≈20k tokens 压在最稀缺 agent 上。
    #   保留节点（方法论审查者/立场与范围/跨语境三剧本有真实学术价值），改为冲刺投稿时显式开。
    default: opt_in
    condition: owner_stress_test_opt_in      # 条件键（真源 = condition_definitions）；opt-in 语义 = 仅主人 Phase 0 勾选才触发
    condition_undecidable: report_to_owner
    on_not_triggered: record_not_triggered_in_status   # 未开启 ≠ 漏跑（与 opt-out 语义分离，留痕口径一致）
    contract_key_carriers: [references/templates/任务简报-template.md, references/agents/00-主控-扩展职责.md]   # owner 节点无派发文件：契约键的机械锚点载体清单（--check 逐文件验「键在」；极性中立，架构评审 v3 R2③）
    verdict_scale: four_tier
    independence: bounded_owner_pressure_test
    note: "T9b 是主控亲完成的文本压力测试（**默认不跑**；主人冲刺投稿时 Phase 0 勾选 `owner_stress_test_opt_in` 开启），不是 T9 盲审，不读取 T7/证据卡/过程稿，不参与修订回环。"
    next: t8_technical_final
  - id: t8_technical_final
    phase: "Phase 5 终检"
    phase_seq: 24
    verdict_scale: four_tier   # v2.12.40：终检结论落四档（通过/不通过/无法判定/路径或参数错误）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = M-Gate-Report + T9 审稿报告均已落盘；不得用缺位时的推断值
    input: final/定稿.md + final/图件/*.svg + final/M-Gate-Report-*.json + audits/审稿报告-vN.md + audits/G14-检测报告-vN.md   # v2.12.37 审计 P1-2：T8 需读 T9 报告做「建议分流」；v2.12.41：G14 迁至 Phase 4.4 前置后，其报告核验职责由 T7 移交 T8
    kind: owner_agent
    agent: T8
    role: T8
    write_authority: owner
    verification_authority: 主控
    fingerprint: required   # v2.12.49 M-1：交付说明头部必填 final/定稿.sha256，与 T7/G14/T9 三方一致 ⇒ 合格；不一致 ⇒ 不合格（审计对象漂移）
    audited_artifact_required: true   # v2.12.49 M-1/M-8：本节点报告必填 audited_artifact 三元组；与 T7/G14/T9 集合相等 ⇒ 合格
    t9_missing_review_policy: {missing_blind_review_blocks_t9_claims: true, owner_acceptance_required_for_limited_delivery: true, complete_final_verdict_forbidden_without_t9_status: true}
    # v2.12.13（方案 3.1）：显式声明输入含 SVG 图件——SVG 嵌入文本孤儿检查已从 T7 移交 T8
    output: final/交付说明.md
    output_chars_max: 10000
    # v2.12.49 M-10：final/局限性.md 入真源（仅 Acknowledged Limitations 模式存在）
    output_conditional:
      acknowledged_limitations_mode: final/局限性.md
    next: methodology_snapshot
  - id: methodology_snapshot
    phase: "Phase 5 终检后置（方法论留档）"
    phase_seq: 25
    kind: owner_agent
    owner: 主控
    write_authority: owner
    input: status.md + final/交付说明.md
    output: run/<项目名>/audits/methodology-footprint-{项目名}.md
    verdict_scale: four_tier
    default: triggered                      # v2.14.0 升级：默认触发（输出 4 节标准结构：研究设计 / 数据来源 / 分析方法 / 局限性），不再要求 Phase 0 opt-in
    opt_out: methodology_snapshot_opt_out   # 主人显式 opt-out 的条件键（真源 = condition_definitions）
    on_opt_out: record_opt_out_in_status
    contract_key_carriers: [references/templates/任务简报-template.md]   # owner 节点无派发文件：契约键机械锚点载体（--check 逐文件验「键在」；极性中立）
    condition_undecidable: report_to_owner   # v2.12.54 R-6：opt-out 记录缺失/不可判定 ⇒ 按默认触发继续 + 呈主人
    note: "v2.14.0 升级：**默认触发**（含 4 节标准结构：研究设计 / 数据来源 / 分析方法 / 局限性）—— 替代 v2.12.49 T-6 的「≤2 节简版」。真源对照：[方法论-审计清单.md](../_shared/真源/方法论-审计清单.md) G18 12 项；模板：templates/方法论章节-template.md + walkthrough references/_shared/真源/方法论-落地示例.md。主人在 Phase 0 显式 opt-out ⇒ 不创建且记 `opt_out`（**不得**记 `not_triggered`，两者语义不同）。"
    next: phase5_acceptance
  - id: phase5_acceptance
    phase: "Phase 5 验收"
    phase_seq: 26
    kind: owner_checkpoint
    blocking: true        # v2.12.49：旧口径「不答 = 接受当前定稿」已删除 —— 静默不得记为 accepted
    owner_visible: true
    decisions: [accepted, revision_requested, restart_phase, deferred]
    timeout_fallback: pending_owner_halt
    blocks: [methodology_snapshot]   # v2.15.13 FB-12：局部阻塞 —— 只阻塞验收后置节点；产物已在盘，挂起不丢任何东西（owner_timeout_policy 同源）
    terminal: accepted   # v2.12.49 M-2：终态标记真源；详见顶层 terminal_freeze 段
    acceptance_reconciliation: required   # R-2(C1) 验收前置对账四项；判据 = 可发表性判定表.md §六；不符 ⇒ halt，不得记 accepted
    delivery_readiness: [submission_ready, accepted_with_open_items]   # R-3(A1) 必填二态，判据同 §六

  # ⚠️ v2.12.54 R-1：**全景载体收敛登记**（修 P0「派生全景与真源漂移」）
  #   历史实况（2026-09-18 论文实测）：11 份文档各自维护全景，**无一与真源一致** ——
  #     · pipeline-overview 缺 4 节点（pre_spawn_enforcement / g14_style_gate / t5_style_revision /
  #       methodology_snapshot），且 T7.5 门被排在「定稿组装」之后（真源 seq 14 应在前）
  #     · README 缺 7 节点 · pipeline-readme 缺 4 节点 · 设计文档-架构「共 6 个阶段」漏全部子阶段
  #     · QUICKSTART 修订回环口径错 + 指针指向已外移章节
  #   后果：**全景是主控与主人的默认认知** —— 缺节点等于该节点在认知层不存在（T9 被静默降级、
  #     G14 风格修订被漏看，均发生在此认知环境下）。
  #   现口径：**全景只保留一份派生视图**（canary），其余文档**必须删除全景段、只留指针**；
  #     由 维护者机制 机械校验（缺节点 / 顺序倒置 / 镜像仍重列 = 构建期校验不通过）。

panorama_sources:
  canary: references/_shared/真源/pipeline-overview.md   # 唯一派生视图：必须完整承载全部节点且首现顺序 = phase_seq
  section_marker: "## 流水线全景"                      # canary 必含；mirrors 必不含（= 全景段已删除）
  pointer_target: _shared/真源/pipeline-overview.md       # mirrors 必含的指针串
  mirrors:                                            # 已删除全景段的文档（只留指针）
    - README.md
    - QUICKSTART.md
    - references/pipeline-readme.md
    - references/设计文档-架构.md
    - references/设计文档-哲学.md
    - references/_shared/真源/glossary-full.md
    - SKILL.md
    - references/_shared/真源/dispatch-header.md
  pointer_exempt:                                     # 不承载全景、但允许出现阶段枚举/步骤映射取值清单（免指针串 + id 计数上限，仍禁全景段）
    - references/templates/status-template.md
    # v2.12.54 T-5：人环卡 = 「13 步 ↔ 25 节点」映射表（非全景）→ 归 exempt；
    #   其 id 合法性由 R-2（status 节点 id 取自 yaml / 禁自创）运行期目视守，卡内已声明「id 唯一真源 = phase-order.yaml」。
    - references/templates/checkpoint-card-template.md
    - references/_shared/真源/phase-1-details.md
    - references/_shared/真源/phase-2-details.md
    - references/_shared/真源/phase-3-details.md
