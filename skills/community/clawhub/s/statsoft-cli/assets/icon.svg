<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90caf9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="20" y="20" width="640" height="640" rx="120" ry="120" fill="url(#bg)"/>
  
  <!-- Chart bars representing statistics -->
  <rect x="140" y="380" width="80" height="180" rx="8" fill="url(#chart)" opacity="0.9"/>
  <rect x="250" y="280" width="80" height="280" rx="8" fill="url(#chart)" opacity="0.9"/>
  <rect x="360" y="180" width="80" height="380" rx="8" fill="url(#chart)" opacity="0.9"/>
  <rect x="470" y="320" width="80" height="240" rx="8" fill="url(#chart)" opacity="0.9"/>
  
  <!-- Terminal cursor -->
  <rect x="140" y="120" width="400" height="40" rx="8" fill="#fff" opacity="0.15"/>
  <text x="160" y="150" font-family="'Courier New', monospace" font-size="28" fill="#90caf9">$</text>
  <rect x="195" y="125" width="160" height="30" rx="4" fill="#90caf9" opacity="0.6"/>
  
  <!-- Decorative dots -->
  <circle cx="580" cy="100" r="12" fill="#42a5f5" opacity="0.5"/>
  <circle cx="610" cy="140" r="8" fill="#90caf9" opacity="0.4"/>
  <circle cx="560" cy="150" r="6" fill="#fff" opacity="0.3"/>
</svg>
