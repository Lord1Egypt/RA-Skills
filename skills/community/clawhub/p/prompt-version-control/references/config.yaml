# .prompt/config.yaml — Prompt Version Control repository configuration
# Generated by `prompt-vc.sh init`

# Repository metadata
repository:
  name: ""
  description: "Prompt Version Control repository"
  created: "1970-01-01T00:00:00Z"
  author: ""

# LLM provider settings (used by prompt test and prompt diff --summary)
llm:
  provider: "openai"
  model: "gpt-4"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 30000
  max_retries: 3

# Version control settings
versioning:
  patch_keywords: ["tweak", "reword", "example", "minor fix", "wording"]
  minor_keywords: ["add", "new variable", "restructure", "change model"]
  major_keywords: ["breaking", "rewrite", "new approach", "schema change"]
  auto_bump: true

# A/B test defaults
testing:
  default_test_count: 5
  significance_threshold: 0.05

# Remote sync (optional)
remote:
  enabled: false
  type: "git"
  url: ""
  branch: "main"

# Git integration
git:
  auto_detect: true
  prompt_dir: ".prompt/"

# Audit trail
audit:
  record_timestamps: true
  record_author: true
  history_immutable: true
