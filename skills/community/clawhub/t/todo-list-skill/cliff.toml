# git-cliff 配置文件
# 用法：git cliff --tag v1.4.0 > CHANGELOG.md
# 业界参考：https://git-cliff.org/

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [unreleased]{% endif %}

{% for group, commits in commits | filter(attribute="merge_ref", value="") | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id | truncate(length=7, end="") }}))
{% endfor %}
{% endfor %}

{% if version -%}
[{{ version }}]: https://gitee.com/ccq/todo-list-skill/releases/tag/{{ version }}
{% endif -%}
"""
footer = """
<!-- Generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

[commit_parsers]
{ message = "^feat", group = "🚀 Features" }
{ message = "^fix", group = "🐛 Bug Fixes" }
{ message = "^doc", group = "📚 Documentation" }
{ message = "^perf", group = "⚡ Performance" }
{ message = "^refactor", group = "🔨 Refactor" }
{ message = "^test", group = "✅ Testing" }
{ message = "^build", group = "📦 Build" }
{ message = "^ci", group = "🔄 CI" }
{ message = "^chore", group = "🔧 Chore" }
{ message = "^style", group = "💄 Style" }
{ message = "^revert", group = "⏪ Revert" }

protect_breaking_commits = true
filter_commits = false
link_breaking_commits = true
breaking_always = false

[changelog.git]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"