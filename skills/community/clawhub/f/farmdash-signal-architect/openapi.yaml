            - type: string
              description: '"[ ENCRYPTED: UPGRADE TO PIONEER ]" (scout tier)'
        sybil_risk:
          oneOf:
            - type: string
              example: Low
            - type: string
              example: '[ ENCRYPTED: UPGRADE TO PIONEER ]'
        tvl:
          oneOf:
            - type: string
              example: $4.2B
            - type: string
              example: '[ ENCRYPTED: UPGRADE TO PIONEER ]'
