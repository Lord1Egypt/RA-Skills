  /agents/swap:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: executeSwap
      summary: Execute a signed token swap
      description: |
        Main swap router. Requires a fresh successful simulationId, authenticates
        the agent via EIP-191 signature, reuses the simulated quote intent, applies
        Execution Alpha routing, and enforces Risk Sentinel guardrails before
        returning ready-to-broadcast transaction calldata.

        FarmDash does not broadcast the returned compatibility-swap transaction. FarmDash prepares
        the transaction calldata for the user or agent wallet to broadcast. Automatic routing dynamically
        selects across active providers (LI.FI, Relay; 0x paused until reinstated).
        The FarmDash treasury receives the fee haircut directly from the protocol.

        **Signing**: The agent must sign the deterministic payload:
        `v1:FARMDASH_SWAP:{fromChainId}:{toChainId}:{fromToken}:{toToken}:{fromAmount}:{agentAddress}:{toAddress}:{nonce}`
        using EIP-191 personal_sign. Nonce must be current timestamp (within 60s).
      tags:
        - Swap
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
            examples:
              default:
                summary: executeSwap request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  fromChainId: 1
                  toChainId: 1
                  fromToken: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                  toToken: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                  fromAmount: '1'
                  agentAddress: '0x1111111111111111111111111111111111111111'
                  toAddress: '0x1111111111111111111111111111111111111111'
                  simulationId: sim_example_001
                  nonce: '1'
                  signature: '0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
                  slippage: 0.5
                  protocol: lifi
      parameters:
        - $ref: '#/components/parameters/X-ClawHub-Skill'
      responses:
        '200':
          description: Executable swap quote with transaction calldata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuote'
              examples:
                success:
                  summary: executeSwap HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    protocol: lifi
                    estimatedOutput: '1'
                    feeBps: 1
                    feeAmountUSD: '1'
                    gasEstimate: '1'
                    txData:
                      to: example
                      data: example
                      value: '1'
                      chainId: 1
                    expiresAt: 1
