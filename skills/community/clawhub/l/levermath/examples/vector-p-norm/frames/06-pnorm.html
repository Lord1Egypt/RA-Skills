<h1 class="onbar" data-k="title" style="left:48px;top:13px;width:933px">p-范数</h1>
<div class="formula big" style="left:53px;top:128px;width:1173px"><span data-tex="\displaystyle \|x\|_2=\left(\sum_{i=1}^{n}x_i^2\right)^{\frac{1}{2}}\quad\longrightarrow\quad \|x\|_p=\left(\sum_{i=1}^{n}|x_i|^p\right)^{\frac{1}{p}},\quad p\ge 1"></span></div>
<div class="formula big" style="left:53px;top:293px;width:1173px"><span data-tex="\displaystyle \|x\|_\infty=\max_{1\le i\le n}|x_i|,\qquad \|x\|_1=\sum_{i=1}^{n}|x_i|,\qquad \|x\|_2=\left(\sum_{i=1}^{n}x_i^2\right)^{\frac{1}{2}}"></span></div>
<div class="formula big" style="left:53px;top:480px;width:1173px"><span data-tex="\displaystyle \|x\|_\infty=\lim_{p\to\infty}\|x\|_p"></span></div>
