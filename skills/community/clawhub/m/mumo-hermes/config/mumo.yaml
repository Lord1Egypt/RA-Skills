# THE API KEY PATH. Most setups do not need this file: add the server with a
# browser sign-in instead, and Hermes writes its own config entry:
#
#     hermes mcp add mumo --url https://mumo.chat/api/mcp/oauth --auth oauth
#
# Use this block for a gateway on a server, a messaging bot, or any unattended
# run. Add it to ~/.hermes/config.yaml under the mcp_servers key. If you
# already have mcp_servers configured, merge mumo as a sibling entry.
#
# The key itself does not go in this file. Put it in ~/.hermes/.env:
#
#     MUMO_API_KEY=mmo_live_your_key_here
#
# Hermes resolves ${MUMO_API_KEY} in headers at connect time, and .env is where
# it expects secrets to live — config.yaml is for everything that isn't one.
#
# After saving, fully exit and restart Hermes — /reload-mcp is unreliable across versions.

mcp_servers:
  mumo:
    url: "https://mumo.chat/api/mcp"
    headers:
      Authorization: "Bearer ${MUMO_API_KEY}"
    connect_timeout: 60
    timeout: 180
    supports_parallel_tool_calls: true
    tools:
      include:
        - create_deliberation
        - ask_a_model
        - wait_for_round
        - append_round
        - get_session
        - list_sessions
        - list_models
        - share_session
        - get_credit
      resources: false
      prompts: false
