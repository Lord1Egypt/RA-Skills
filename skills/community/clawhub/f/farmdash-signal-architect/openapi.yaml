                  summary: executeSwap HTTP 400
                  description: Illustrative structured error; live code/retryability/request ID are authoritative.
                  value:
                    error: invalid_request
                    code: invalid_request
                    details: Illustrative FarmDash API example.
        '401':
          description: Invalid signature or expired nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
