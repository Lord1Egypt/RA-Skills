[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keynote-mcp-server"
version = "1.0.0"
description = "通过 MCP (Model Context Protocol) 让 AI 操作 macOS Keynote"
requires-python = ">=3.10"
authors = [
    {name = "Keynote MCP Server"}
]
dependencies = [
    "mcp[cli]>=1.0.0"
]

[project.scripts]
keynote-mcp-server = "server:main"

[tool.setuptools.packages]
find = {}
