# Copy to .github/workflows/desktop-build.yml. See release-workflow.md for setup.
name: Build Desktop App
env:
  DESKTOP_RELEASE_MODE: manual
'on':
  workflow_dispatch: null
  push:
    tags:
      - v*
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      commit: ${{ steps.draft.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: draft
        shell: bash
        run: bash .github/scripts/ci/prepare-draft.sh
  publish-tauri:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    uses: ./.github/workflows/tauri-build.yml
    with:
      runner: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      draft-id: ${{ needs.draft.outputs.id }}
      source-commit: ${{ needs.draft.outputs.commit }}
      publish: ${{ github.event_name == 'push' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  verify-draft:
    if: github.event_name == 'push'
    needs:
      - draft
      - publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      DRAFT_ID: ${{ needs.draft.outputs.id }}
      SOURCE_COMMIT: ${{ needs.draft.outputs.commit }}
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: tauri-evidence-*
          path: release-evidence
          merge-multiple: true
      - name: Verify draft contents before manual publication
        shell: bash
        run: bash .github/scripts/ci/verify-draft.sh
      - name: SHA256SUMS from verified assets
        shell: bash
        run: bash .github/scripts/ci/write-checksums.sh
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
