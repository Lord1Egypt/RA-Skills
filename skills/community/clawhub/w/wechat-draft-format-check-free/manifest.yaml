name: wechat-draft-format-check-free
slug: wechat-draft-format-check-free
display_name: 公众号草稿排版检查
description: 在用户指定的 Easy WebBridge 浏览器环境中，只读检查本人指定的公众号草稿与目标阅读样式，交付标题层级、长段落、图片说明、断链和空白问题清单及可见来源。适合发布前短文或单章节复核；草稿归属不明、编辑器不可见、登录验证或内容超出单批范围时暂停并列出缺项，不修改草稿、不发送、不发布。
version: 1.0.2
repository: https://github.com/xxjrq/wechat-draft-format-check-free
license: MIT-0
icon: icon-512.png
tags:
  - wechat
  - public-account
  - proofreading
  - typography
  - browser-automation
trigger_words:
  - 公众号草稿排版检查
  - 检查微信文章格式
  - 公众号发布前校对
interface:
  display_name: 公众号草稿排版检查
  short_description: 只读检查公众号草稿的标题段落图片与链接问题，交付可追溯修改清单
  default_prompt: 使用我指定的 browserId，只读检查本人公众号草稿的标题、段落、图片说明、断链与空白；不要修改、发送或发布。
  icon_small: icon-512.png
  icon_large: icon-512.png
self_test: node scripts/self-test.mjs
