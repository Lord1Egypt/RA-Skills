<section data-name="月下团圆" data-background="#FAF8F2">
  <section data-type="richText" data-name="01 版首">
    <section style="padding:32px 10px 8px;text-align:center;">
      <span style="display:inline-block;font-size:11px;letter-spacing:4px;color:#4A5D52;">节气 · 中秋特刊</span>
      <p style="margin:8px 0 0;font-size:12px;color:#7B8479;letter-spacing:1px;">约 600 字 · 3 分钟</p>
    </section>
  </section>
  <svg width="390" height="120" data-name="01 入场点缀">
    <g data-type="animationGroup" data-mode="autoplay" data-name="标题入场">
      <rect
        x="175"
        y="16"
        width="40"
        height="1"
        fill="#4A5D52"
        opacity="0"
        data-editor-visible="true"
      >
        <animate data-preset="渐现" data-trigger="load" data-duration="0.45" />
      </rect>
      <foreignObject x="40" y="36" width="310" height="48">
        <section
          style="font-size:24px;font-weight:700;color:#4A5D52;text-align:center;letter-spacing:2px;line-height:1.35;"
        >
          月下团圆
        </section>
        <animate
          data-preset="上浮渐现"
          data-trigger="load"
          data-delay="0.4"
          data-duration="0.55"
        />
      </foreignObject>
    </g>
  </svg>
  <section data-type="richText" data-name="02 钩子">
    <section style="padding:8px 10px 24px;text-align:center;">
      <p style="margin:0 0 10px;font-size:16px;line-height:2;color:#4F5B52;letter-spacing:0.5px;">今年中秋，你还要不要回家吃饭。</p>
      <p style="margin:0;font-size:16px;line-height:2;color:#4F5B52;letter-spacing:0.5px;">礼盒可以快递，那顿饭不行。</p>
    </section>
  </section>
  <section data-type="richText" data-name="04 先看见月亮">
    <section style="margin:8px 10px 12px;text-align:center;">
      <p style="margin:0;font-size:18px;font-weight:700;color:#4A5D52;letter-spacing:1px;">先看见月亮</p>
    </section>
    <section style="padding:0 10px 8px;text-align:center;">
      <p style="margin:0;font-size:16px;line-height:2;color:#4F5B52;letter-spacing:0.5px;">不必爬最高的楼。院子里、窗台上，抬一次头就够。</p>
    </section>
  </section>
  <svg width="390" height="200" data-name="04 金句点睛">
    <rect x="40" y="8" width="88" height="28" rx="2" fill="#4A5D52" />
    <text x="48" y="12" width="72" height="20" fill="#FAF8F2" font-size="12">
      点开看 ›
    </text>
    <g
      data-type="animationGroup"
      data-mode="appear"
      data-trigger="pointerUp"
      data-order="up"
      data-name="金句出现"
    >
      <rect x="40" y="52" width="310" height="120" rx="2" fill="#F4F1E8">
        <animate
          data-preset="上浮渐现"
          data-trigger="pointerUp"
          data-delay="0"
          data-duration="0.5"
        />
      </rect>
      <foreignObject x="56" y="76" width="278" height="80">
        <section
          style="font-size:16px;font-weight:700;color:#4A5D52;text-align:center;line-height:1.75;letter-spacing:0.5px;"
        >
          月亮不会等人。你在忙，它也照常升起。
        </section>
        <animate
          data-preset="渐现"
          data-trigger="pointerUp"
          data-delay="0.4"
          data-duration="0.4"
        />
      </foreignObject>
    </g>
  </svg>
  <section data-type="richText" data-name="09 END">
    <section style="padding:24px 10px 8px;text-align:center;">
      <section style="width:40px;height:1px;background:#4A5D52;margin:0 auto 16px;"></section>
      <p style="margin:0;font-size:16px;line-height:2;color:#4F5B52;letter-spacing:0.5px;">月亮年年有。人要自己回来。</p>
    </section>
  </section>
  <section data-type="richText" data-name="AI 声明">
    <section style="padding:16px 10px 32px;text-align:center;">
      <p style="margin:0;font-size:12px;color:#7B8479;line-height:1.5;">文章部分内容由AI辅助设计和制作</p>
    </section>
  </section>
</section>
