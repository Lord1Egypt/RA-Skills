<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc" lang="en">
<title id="title">OpenXSys runtime panorama</title><desc id="desc">A person enters through an AI tool. OpenXSys organizes models, Agents, Skills, tools, works, action, feedback, and the user's lasting system around the current runnable system instance.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#536f69" stroke-width="1.6"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9b6b2f" stroke-width="1.6"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.title{font-size:27px;font-weight:760;fill:#173b3b}.sub{font-size:14px;fill:#536b70}.group{font-size:16px;font-weight:750;fill:#315653}.box{font-size:18px;font-weight:750;fill:#173b3b}.body{font-size:13px;fill:#486066}.tiny{font-size:12px;fill:#536b70}.wire{fill:none;stroke:#536f69;stroke-width:2;marker-end:url(#a)}.build{fill:none;stroke:#9b6b2f;stroke-width:2;marker-end:url(#b)}.dash{stroke-dasharray:6 6}</style>
<rect x=".5" y=".5" width="1399" height="849" rx="20" fill="#f7f8f3" stroke="#d8e0db"/>
<text x="38" y="48" class="title">OpenXSys runtime panorama</text><text x="38" y="75" class="sub">The user journey is what you experience. This is the system behind it: every part acts around the same real subject and returns its result to the right place.</text>
<rect x="35" y="136" width="230" height="170" rx="15" fill="#fbebe4" stroke="#c99d8e"/><text x="55" y="168" class="box">Person</text><text x="55" y="197" class="body">ordinary language · intent</text><text x="55" y="220" class="body">correction · choice · ownership</text><text x="55" y="252" class="tiny">enters through the AI tool</text>
<path class="wire" d="M265 216H323"/><text x="294" y="203" text-anchor="middle" class="tiny">intent</text>
<rect x="325" y="102" width="750" height="560" rx="18" fill="#e8f0e9" stroke="#94aa9c" stroke-width="2"/><text x="350" y="134" class="group">AI TOOL · THE HOST</text>
<text x="350" y="158" class="tiny">conversation · context · files · events · permissions · result return</text>
<rect x="350" y="178" width="700" height="458" rx="15" fill="#f7faf4" stroke="#a4b9a9"/><text x="375" y="210" class="group">OPENXSYS · THE SYSTEM LAYER</text>
<text x="375" y="234" class="tiny">natural language carries purpose, meaning, conditions, models, rights, and quality</text>
<rect x="377" y="258" width="145" height="74" rx="12" fill="#edf4fb" stroke="#9eb4cb"/><text x="449" y="287" text-anchor="middle" class="box">Model</text><text x="449" y="310" text-anchor="middle" class="tiny">understand · reason</text>
<rect x="534" y="258" width="145" height="74" rx="12" fill="#edf4fb" stroke="#9eb4cb"/><text x="606" y="287" text-anchor="middle" class="box">Agents</text><text x="606" y="310" text-anchor="middle" class="tiny">organize action</text>
<rect x="691" y="258" width="145" height="74" rx="12" fill="#fff4e6" stroke="#c7a06c"/><text x="763" y="287" text-anchor="middle" class="box">Skills</text><text x="763" y="310" text-anchor="middle" class="tiny">specialized ability</text>
<rect x="848" y="258" width="175" height="74" rx="12" fill="#edf6f0" stroke="#8eb79e"/><text x="935" y="287" text-anchor="middle" class="box">Code &amp; tools</text><text x="935" y="310" text-anchor="middle" class="tiny">observe · transform · act</text>
<rect x="510" y="378" width="380" height="116" rx="17" fill="#e4efce" stroke="#8da879" stroke-width="2"/><text x="700" y="410" text-anchor="middle" class="group">CURRENT RUNNABLE SYSTEM</text><text x="700" y="439" text-anchor="middle" class="box">subject × person × purpose × state</text><text x="700" y="465" text-anchor="middle" class="body">scale · relations · authority · evidence · open questions</text>
<path class="wire" d="M449 334V365H560"/><path class="wire" d="M606 334V365"/><path class="wire" d="M763 334V365"/><path class="wire" d="M935 334V365H840"/>
<rect x="378" y="531" width="185" height="70" rx="12" fill="#edf5fa" stroke="#91afc1"/><text x="470" y="559" text-anchor="middle" class="box">Understand</text><text x="470" y="581" text-anchor="middle" class="tiny">observe · model · test</text>
<rect x="576" y="531" width="190" height="70" rx="12" fill="#fff4e6" stroke="#c7a06c"/><text x="671" y="559" text-anchor="middle" class="box">Build</text><text x="671" y="581" text-anchor="middle" class="tiny">compose · adapt · create</text>
<rect x="779" y="531" width="244" height="70" rx="12" fill="#f4eff8" stroke="#b09cc1"/><text x="901" y="559" text-anchor="middle" class="box">Act · verify · update</text><text x="901" y="581" text-anchor="middle" class="tiny">real effect returns as feedback</text>
<path class="wire" d="M560 494L500 528"/><path class="build" d="M700 494V528"/><path class="wire" d="M840 494L875 528"/><path class="wire dash" d="M901 603V615H470V603"/>
<rect x="1135" y="136" width="230" height="260" rx="15" fill="#eef1fa" stroke="#9ba8ca"/><text x="1155" y="168" class="box">Real subject</text><text x="1155" y="197" class="body">company · project · industry</text><text x="1155" y="220" class="body">codebase · decision · life</text><text x="1155" y="252" class="tiny">holds authoritative state</text><text x="1155" y="273" class="tiny">and changes independently</text>
