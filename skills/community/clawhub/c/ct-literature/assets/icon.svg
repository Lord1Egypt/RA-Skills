<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="100%">
  <defs>
    <filter id="litShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1C6DD0" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 圆角背景 -->
  <rect x="2" y="2" width="100" height="100" rx="20" fill="#EAF2FB" stroke="#C5DCF5" stroke-width="0.5" filter="url(#litShadow)"/>

  <!-- 打开的书本 — literature 核心符号 -->
  <g transform="translate(52,56)">
    <!-- 左页 -->
    <path d="M-22,-18 Q-11,-22 0,-18 L0,18 Q-11,14 -22,18 Z"
          fill="#FFFFFF" stroke="#1C6DD0" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 右页 -->
    <path d="M22,-18 Q11,-22 0,-18 L0,18 Q11,14 22,18 Z"
          fill="#FFFFFF" stroke="#1C6DD0" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 书脊 -->
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#1C6DD0" stroke-width="2.5"/>
    <!-- 左页文字行 -->
    <line x1="-18" y1="-6" x2="-5" y2="-6" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="-8" y2="0" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-18" y1="6" x2="-11" y2="6" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 右页文字行 -->
    <line x1="5" y1="-6" x2="18" y2="-6" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="15" y2="0" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="6" x2="12" y2="6" stroke="#AFA9EC" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 右上角放大镜 — 检索/文献搜索语义 -->
  <circle cx="74" cy="42" r="11" fill="#9FE1CB" stroke="#1C6DD0" stroke-width="2"/>
  <line x1="81" y1="49" x2="89" y2="57" stroke="#1C6DD0" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="70" y1="42" x2="78" y2="42" stroke="#1C6DD0" stroke-width="1.6" stroke-linecap="round"/>
</svg>
