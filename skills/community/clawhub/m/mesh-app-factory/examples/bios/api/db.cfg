[
{
    "name": "list",
    "property" : "private",
    "tokenChecker": "MNT",
    "method": "GET",
    "comment":"列举所有DB",
    
    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"[0-9a-zA-Z_]{1,30}", "comment":"服务名称"}
    ],
    
    "process" : [
        {
            "name" : "list",
            "type" : "biosmeta",
            "actions" : [
                {"action":"gets", "key":"/service/@{service}/dbs", "val":".+\\.type"}
            ]
        }
    ],
    "response":[
        {"name":"dbs", "type":"object", "list":true, "checkAll":false}
    ]
},

{
    "name": "detail",
    "property" : "private",
    "method": "GET",
    "tokenChecker": "MNT",

    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"[0-9a-zA-Z_]{1,30}"},
        {"name":"db", "type":"string", "must":true, "regular":"[0-9a-zA-Z_]{1,30}"}
    ],

    "process" : [
        {
            "name" : "detail",
            "type" : "biosmeta",
            "actions": [
                {"action":"get", "key":"/service/@{service}/dbs/@{db}.ver", "as":"ver"},
                {"action":"get", "key":"/service/@{service}/dbs/@{db}.type", "as":"type"}
            ]
        }
    ]
},

{
    "name": "authInfo",
    "property" : "private",
    "tokenChecker": "APP-oauth2",
    "method": "GET",
    "comment":"获取需要Auth的服务的公钥及可以调用的features",
    
    "request": [
        {"name":"service", "type":"string", "must":true, "regular":"[0-9a-zA-Z_]{1,30}", "comment":"调用方服务名"},
        {"name":"callee", "type":"string", "must":true, "regular":"[0-9a-zA-Z_]{1,30}", "comment":"db名称，为了与service.authInfo参数名称保持一直"}
    ],
    "process" : [
        {
            "name" : "authInfo",
            "type" : "biosmeta",
            "actions": [
                {"action":"get", "key":"/service/@{service}/key"},
                {"action":"get", "key":"/service/@{service}/dbs/@{callee}.type", "as":"features"}
            ],
            "onSuccess":"{
                \"publicKey\":\"@{ECKEYPAIR|public,!key}\"
            }"
        }
    ],
    "response":[
        {"name":"features", "type":"string", "must":true},
        {"name":"publicKey", "type":"string", "must":true}
    ]
},

{
    "name": "nodes",
    "property" : "private",
    "tokenChecker": "BIOS",
    "method": "GET",
    "comment":"业务查询DB的节点，首先精确匹配，然后模糊匹配，
        与dbNodes的区别是请求来自db所属的服务，查询服务的数据库节点",
    
    "request": [
        {"name":"dbNo", "type":"int", "must":true, "min":0, "comment":"webdb实例编号"},
        {"name":"partId", "type":"int", "must":false, "min":0, "comment":"分区id"}
    ],

    "vars": [
        {"name":"pid", "val":"@{IFNULL|partId, #tokenPartId, num}"}
    ],
    
    "process" : [
        {
            "name" : "nodes",
            "type" : "biosdb",
            "db":"mesh_status",
            "comment":"查询状态为主从库且正常的实例",
            "sqls": [{
                "name":"nodes",
                "multi":true,
                "metas":"each",
                "sql":"select addr,shardStart,shardEnd,slaves,ver,level,dbstatus status from dbstatus 
                  where partId=@{pid} and dbNo=@{dbNo} and dbstatus in('M','S')
                  order by shardStart,level"
            }]
        }
    ]
},

{
    "name": "listConfig",
    "property" : "private",
    "method": "GET",
    "tokenChecker": "MNT",
    "comment":"列举所有数据库实例的配置信息，记录在webdb服务的dbs目录下，
            与服务的数据库信息不是一回事，这里记录webdb 实例addr->实例配置信息",

    "process" : [{
        "name" : "list_db_config",
        "type" : "biosmeta",
        "actions": [
            {"action":"gets", "key":"/service/webdb/dbs", "as":"list"}
        ]
    }]
},

{
    "name": "getConfig",
    "property" : "private",
    "method": "GET",
    "tokenChecker": "APP-webdb",
    "comment":"按实例的内网ip查询webdb实例的配置信息",

    "request": [
        {"name":"addr", "type":"ip", "must":true, "format":"V4|LAN|PORT", "comment":"内网IP+端口号"}
    ],

    "process" : [{
        "name" : "get_db_config",
        "type" : "biosmeta",
        "actions": [
            {"action":"get", "key":"/service/webdb/dbs/@{addr}", "as":"cfg"}
        ]
    }]
},

{
    "name": "setConfig",
    "property" : "private",
    "method": "PUT",
    "tokenChecker": "MNT",
    "comment":"设置webdb实例的配置信息，一个实例只能设置一条，但是cfg中可以有多个db",

    "request": [
        {"name":"addr", "type":"ip", "must":true, "format":"V4|LAN|PORT", "comment":"内网IP+端口号"},
        {"name":"cfg", "type":"string", "must":true, "comment":"配置信息，一个list形式的json体字符串"}
    ],

    "process" : [
        {
            "name" : "check_cfg",
            "type" : "js",
            "script":"(function() {
                var jsonCfg=@{cfg};
                for(var d of jsonCfg) {
                    if(isNaN(parseInt(d.no))) {
                        return Mesh.error(RetCode.WRONG_PARAMETER, 'invalid no ' + d.no);
                    }
                    var start=parseInt(d.shardStart);
                    var end=parseInt(d.shardEnd);
                    if(isNaN(start) || start<0 || isNaN(end) || end>32768) {
                        return Mesh.error(RetCode.WRONG_PARAMETER, 'invalid shardStart or shardEnd of ' + d.no);
                    }
                    if(start>=end) {
                        return Mesh.error(RetCode.WRONG_PARAMETER, 'shardStart>=shardEnd of ' + d.no);
                    }
                }
                return Mesh.success({});
            })()"
        },
        {
            "name" : "set_db_config",
            "type" : "biosmeta",
            "actions": [
                {"action":"put", "key":"/service/webdb/dbs/@{addr}", "value":"@{cfg}"}
            ]
        }
    ],
    "response":[]
},
{
    "name": "checkConfig",
    "property" : "private",
    "method": "GET",
    "tokenChecker": "MNT",
    "comment":"检查配置sharding是否全部覆盖",

    "process" : [
        {
            "name" : "check_cfg",
            "type" : "biosmeta",
            "actions": [
                //不存在时，不会返回NOT_EXISTS，而是返回空数组
                {"action":"gets", "key":"/service/webdb/dbs", "as":"dbs"}
            ],
            
            //检查dbno是否重复，如果重复，会导致客户端请求时错乱
            "onSuccess":"js:(function() {
                var dbs=@{!dbs};
                var nodes,s;
                var shardings={};
                for(var d of dbs) { //addr(name)->cfg(val)
                    nodes=JSON.parse(d.val); //[{no:xx,level:xx,shardStart:xx,shardEnd:..}..]
                    for(var n of nodes) {
                        if(!(s = shardings[n.no])){
                            s=new Array(32768).fill(0);
                            shardings[n.no]=s;
                        }
                        for(var i=n.shardStart;i<n.shardEnd;i++) {
                            if(s[i]!=0) {//重叠分片
                                return Mesh.error(RetCode.DATA_WRONG, 'duplicated sharding,('+n.shardStart+'-'+n.shardEnd+')@'+d.name+'#'+n.no);
                            }
                            s[i]=1;
                        }
                    }
                }

                for(var no in shardings) {//dbNo->sharding
                    s=shardings[no];
                    for(var i in s) {
                        if(s[i]==0) { //未覆盖的分片
                            return Mesh.error(RetCode.DATA_WRONG, 'empty sharding,('+i+')#'+no);
                        }
                    }
                }
                return Mesh.success({});
            })()"
        }
    ],
    "response":[]
},

{
    "name": "removeServer",
    "property" : "private",
    "method": "DELETE",
    "tokenChecker": "MNT",
    "comment":"删除webdb实例",

    "request": [
        {"name":"addr", "type":"ip", "must":true, "format":"V4|LAN|PORT", "comment":"实例带端口号的内网IP"}
    ],

    "process" : [{
        "name" : "remove_db_config",
        "type" : "biosmeta",
        "actions": [
            {"action":"rmv", "key":"/service/webdb/dbs/@{addr}"}
        ]
    }]
}
]