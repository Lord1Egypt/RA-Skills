  <text x="40" y="246" fill="#565f89">⏺ crew send --to neon "…"</text>
  <text x="40" y="266" fill="#565f89">⏺ crew send --to astra "…"</text>
  <text x="40" y="286" fill="#565f89">⏺ crew read --name astra</text>
